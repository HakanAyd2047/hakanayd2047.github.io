<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blender Academy — Sıfırdan 3D Öğren</title>
<meta name="description" content="Blender'ı sıfırdan öğrenen, görsel ve etkileşimli bir 3D eğitim platformu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  color-scheme: dark;
  --void:#0a0a0c;
  --surface:#131317;
  --surface-2:#1a1a1f;
  --surface-3:#212127;
  --border:#26262d;
  --border-soft:#1d1d22;
  --accent:#ff7a1f;
  --accent-dim:#a84e17;
  --accent-soft:rgba(255,122,31,0.12);
  --text-1:#f1efe9;
  --text-2:#a3a3ad;
  --text-3:#63636c;
  --good:#3ec98a;
  --warn:#e8b339;
  --danger:#e0574f;
  --radius-s:3px;
  --radius-m:6px;
  --font-display:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--void);
  color:var(--text-1);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#0a0a0c;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--void);}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--border);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-0.01em;}
code, .mono{font-family:var(--font-mono);}
.container{max-width:1180px;margin:0 auto;padding:0 28px;}
.text-2{color:var(--text-2);}
.text-3{color:var(--text-3);}
.accent{color:var(--accent);}

/* ---------- Nav ---------- */
.topnav{
  position:sticky;top:0;z-index:50;
  background:rgba(10,10,12,0.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.topnav-inner{
  max-width:1180px;margin:0 auto;padding:0 28px;
  height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-0.01em;}
.brand-mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(155deg, var(--accent), var(--accent-dim));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;font-weight:700;color:#0a0a0c;
}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{
  padding:8px 14px;border-radius:var(--radius-m);font-size:14px;color:var(--text-2);
  transition:color .15s ease, background .15s ease;
}
.nav-link:hover{color:var(--text-1);background:var(--surface-2);}
.nav-link.active{color:var(--text-1);background:var(--surface-2);}
.nav-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:36px;height:36px;border-radius:var(--radius-m);border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;
  transition:border-color .15s ease, color .15s ease;
}
.icon-btn:hover{border-color:var(--accent);color:var(--text-1);}
.hamburger{display:none;}
@media (max-width:860px){
  .nav-links{display:none;}
  .hamburger{display:flex;}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:var(--radius-m);font-size:14px;font-weight:600;
  border:1px solid transparent;transition:transform .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:#0c0a08;}
.btn-primary:hover{background:#ff8c3d;}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-1);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-sm{padding:8px 14px;font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Hero ---------- */
.hero{position:relative;padding:88px 0 64px;overflow:hidden;}
.hero-grid{
  position:absolute;inset:0;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--border-soft) 1px, transparent 1px), linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 20%, black 40%, transparent 100%);
}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;}
@media (max-width:960px){.hero-inner{grid-template-columns:1fr;}}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;
  color:var(--accent);background:var(--accent-soft);border:1px solid rgba(255,122,31,0.28);
  padding:5px 11px;border-radius:20px;margin-bottom:22px;
}
.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);}
.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.05;margin-bottom:20px;}
.hero p.lead{font-size:17px;color:var(--text-2);max-width:520px;margin-bottom:32px;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--font-display);font-size:22px;}
.hero-stat span{font-size:12px;color:var(--text-3);}
.hero-stage{
  position:relative;height:380px;border:1px solid var(--border);border-radius:10px;
  background:radial-gradient(circle at 50% 30%, #17171b 0%, #0d0d10 70%);
  overflow:hidden;
}
.hero-stage canvas{width:100%!important;height:100%!important;display:block;}
@media (max-width:960px){.hero-stage{height:260px;}}

/* ---------- Section shell ---------- */
.section{padding:64px 0;border-top:1px solid var(--border-soft);}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;flex-wrap:wrap;}
.section-head h2{font-size:clamp(24px,3.4vw,32px);}
.section-head p{color:var(--text-2);max-width:460px;font-size:14.5px;margin-top:8px;}

/* ---------- Roadmap ---------- */
.roadmap{display:flex;flex-direction:column;border-left:1px solid var(--border);margin-left:22px;}
.roadmap-item{
  position:relative;padding:20px 0 20px 34px;border-bottom:1px solid var(--border-soft);
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  transition:background .15s ease;cursor:pointer;
}
.roadmap-item:hover{background:var(--surface);}
.roadmap-item:last-child{border-bottom:none;}
.roadmap-item::before{
  content:'';position:absolute;left:-6px;top:calc(50% - 6px);width:11px;height:11px;border-radius:50%;
  background:var(--void);border:2px solid var(--border);
}
.roadmap-item[data-status="available"]::before{border-color:var(--accent);background:var(--accent);}
.roadmap-item[data-status="partial"]::before{border-color:var(--accent);}
.roadmap-num{font-family:var(--font-mono);font-size:13px;color:var(--text-3);width:28px;}
.roadmap-item[data-status="available"] .roadmap-num,
.roadmap-item[data-status="partial"] .roadmap-num{color:var(--accent);}
.roadmap-body h4{font-size:16px;margin-bottom:4px;}
.roadmap-body p{font-size:13.5px;color:var(--text-2);max-width:520px;}
.roadmap-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
@media (max-width:700px){
  .roadmap-item{grid-template-columns:auto 1fr;}
  .roadmap-meta{grid-column:2;justify-content:flex-start;}
}

/* ---------- Badges / pills ---------- */
.badge{
  font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--border);
  color:var(--text-2);white-space:nowrap;
}
.badge-level-0{color:var(--good);border-color:rgba(62,201,138,.3);}
.badge-level-1{color:var(--warn);border-color:rgba(232,179,57,.3);}
.badge-level-2{color:var(--danger);border-color:rgba(224,87,79,.3);}
.badge-locked{color:var(--text-3);}
.badge-accent{color:var(--accent);border-color:rgba(255,122,31,.35);background:var(--accent-soft);}

/* ---------- Generic cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:22px;transition:border-color .15s ease, transform .15s ease;
}
.card-hover:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr;}}

.module-card h3{font-size:17px;margin:12px 0 6px;}
.module-card .m-num{font-family:var(--font-mono);color:var(--accent);font-size:13px;}
.module-card p{font-size:13.5px;color:var(--text-2);margin-bottom:14px;}
.module-progress-track{height:5px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.module-progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;}

/* ---------- Layout: sidebar + content (lesson pages) ---------- */
.app-shell{display:flex;align-items:flex-start;min-height:calc(100vh - 64px);}
.side{
  width:270px;flex-shrink:0;border-right:1px solid var(--border-soft);
  padding:28px 16px 60px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;
}
.side-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-3);padding:0 10px 8px;text-transform:uppercase;}
.side-mod{margin-bottom:6px;}
.side-mod-head{
  display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:var(--radius-m);
  font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text-1);
}
.side-mod-head:hover{background:var(--surface-2);}
.side-mod-lessons{padding-left:8px;overflow:hidden;}
.side-lesson{
  display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px;font-size:13.5px;color:var(--text-2);
  border-left:1px solid var(--border-soft);margin-left:8px;border-radius:0 var(--radius-m) var(--radius-m) 0;
}
.side-lesson:hover{color:var(--text-1);background:var(--surface-2);}
.side-lesson.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);}
.side-lesson .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;}
.side-lesson.done .dot{background:var(--good);}
.side-lesson.locked{color:var(--text-3);}
.content-main{flex:1;min-width:0;padding:36px 40px 100px;max-width:900px;}
@media (max-width:960px){
  .side{position:fixed;left:0;top:64px;background:var(--void);z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:20px 0 40px rgba(0,0,0,.4);}
  .side.open{transform:translateX(0);}
  .content-main{padding:26px 18px 80px;}
  .mobile-side-toggle{display:flex!important;}
}
.mobile-side-toggle{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text-2);border:1px solid var(--border);padding:8px 12px;border-radius:var(--radius-m);margin-bottom:20px;}

/* ---------- Lesson content blocks ---------- */
.lesson-kicker{font-family:var(--font-mono);color:var(--accent);font-size:13px;margin-bottom:10px;}
.lesson-title{font-size:clamp(26px,4vw,36px);margin-bottom:10px;}
.lesson-sub{color:var(--text-2);font-size:15.5px;max-width:640px;margin-bottom:26px;}
.lesson-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px;}
.lblock{margin:34px 0;}
.lblock h3{font-size:20px;margin-bottom:12px;}
.lblock p{font-size:15px;color:#d6d5cf;margin-bottom:12px;}
.lblock p:last-child{margin-bottom:0;}

.box{border-radius:var(--radius-m);padding:18px 20px;border:1px solid var(--border);margin:20px 0;}
.box-why{background:var(--surface);border-left:3px solid var(--accent);}
.box-why h4{font-size:13px;color:var(--accent);font-family:var(--font-mono);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.box-warn{background:rgba(232,179,57,.06);border-color:rgba(232,179,57,.28);}
.box-warn h4{font-size:14px;color:var(--warn);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.box-warn ul{margin:8px 0;padding-left:20px;font-size:14px;color:var(--text-2);}
.box-warn .fix{margin-top:10px;padding-top:10px;border-top:1px solid rgba(232,179,57,.2);font-size:14px;}
.box-warn .fix b{color:var(--warn);}
.box-tip{background:var(--surface);border-color:var(--border);}
.box-tip h4{font-size:13px;color:var(--good);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.box-memorize{background:var(--surface-2);text-align:left;}
.box-memorize h4{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--text-3);margin-bottom:12px;}
.box-memorize .kv{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.box-memorize .kv span{font-family:var(--font-mono);font-size:14px;background:var(--void);border:1px solid var(--border);padding:4px 10px;border-radius:4px;}
.box-memorize p{font-size:13.5px;color:var(--text-2);margin:0;}
.box-mini{background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);}
.box-mini h4{font-size:14px;color:var(--text-1);margin-bottom:10px;}
.box-mini ul{margin:10px 0;padding-left:20px;font-size:14px;color:var(--text-2);}

/* ---------- Keyboard keys / shortcuts ---------- */
.key{
  display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 9px;
  background:var(--surface-3);border:1px solid var(--border);border-bottom:2px solid var(--border);
  border-radius:5px;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text-1);
}
.key-combo{display:flex;align-items:center;gap:6px;}
.key-combo .plus{color:var(--text-3);font-size:12px;}
.shortcut-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;
  display:flex;flex-direction:column;gap:12px;transition:border-color .15s ease;
}
.shortcut-card:hover{border-color:var(--accent-dim);}
.shortcut-card .name{font-size:13px;font-weight:600;}
.shortcut-card .desc{font-size:12.5px;color:var(--text-2);}
.shortcut-card .example{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:6px 9px;border-radius:4px;}

/* ---------- Step system ---------- */
.step-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.step{display:flex;gap:16px;padding:18px 20px;border-bottom:1px solid var(--border-soft);align-items:flex-start;background:var(--surface);}
.step:last-child{border-bottom:none;}
.step-num{font-family:var(--font-mono);font-size:13px;color:var(--text-3);width:26px;padding-top:2px;flex-shrink:0;}
.step.done .step-num{color:var(--good);}
.step-body{flex:1;}
.step-body p{font-size:14.5px;margin:0 0 8px;color:#d6d5cf;}
.step-code{font-family:var(--font-mono);font-size:13px;background:var(--void);border:1px solid var(--border);padding:8px 12px;border-radius:4px;display:inline-block;color:var(--accent);}
.step-check{
  border:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius-m);padding:7px 14px;font-size:13px;
  display:flex;align-items:center;gap:7px;flex-shrink:0;color:var(--text-2);
}
.step.done .step-check{background:rgba(62,201,138,.12);border-color:rgba(62,201,138,.4);color:var(--good);}
.step-progress-wrap{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.step-progress-track{flex:1;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.step-progress-fill{height:100%;background:var(--good);border-radius:4px;transition:width .3s ease;}
.step-progress-label{font-family:var(--font-mono);font-size:12px;color:var(--text-2);white-space:nowrap;}

/* ---------- Interactive demo shell ---------- */
.demo-shell{border:1px solid var(--border);border-radius:var(--radius-m);background:var(--surface);overflow:hidden;margin:22px 0;}
.demo-canvas-wrap{height:320px;background:radial-gradient(circle at 50% 30%, #16161a 0%, #0d0d10 75%);position:relative;}
.demo-canvas-wrap canvas{width:100%!important;height:100%!important;display:block;cursor:grab;}
.demo-canvas-wrap:active canvas{cursor:grabbing;}
.demo-hint{position:absolute;bottom:10px;left:12px;font-family:var(--font-mono);font-size:11px;color:var(--text-3);}
.demo-controls{padding:16px 20px;border-top:1px solid var(--border-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.slider-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--border-soft);}
.slider-row label{font-family:var(--font-mono);font-size:12px;color:var(--text-2);width:110px;flex-shrink:0;}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);}
.slider-row .val{font-family:var(--font-mono);font-size:12px;color:var(--accent);width:38px;text-align:right;}
.seg-toggle{display:flex;gap:6px;}
.seg-toggle button{padding:6px 12px;font-size:12px;border-radius:4px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);}
.seg-toggle button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* ---------- Before / After ---------- */
.compare{position:relative;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;height:260px;background:var(--surface);}
.compare-side{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
.compare-before{clip-path:inset(0 50% 0 0);}
.compare-label{position:absolute;top:12px;font-family:var(--font-mono);font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);}
.compare-label.b-label{left:12px;}
.compare-label.a-label{right:12px;color:var(--accent);border-color:var(--accent-dim);}
.compare-handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--accent);cursor:ew-resize;}
.compare-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);}

/* ---------- Next lesson ---------- */
.next-lesson{
  margin-top:50px;padding:22px 24px;border:1px solid var(--border);border-radius:var(--radius-m);
  display:flex;justify-content:space-between;align-items:center;background:var(--surface);gap:16px;flex-wrap:wrap;
}
.next-lesson .label{font-family:var(--font-mono);font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.next-lesson .title{font-size:17px;}

/* ---------- Footer ---------- */
.footer{border-top:1px solid var(--border-soft);padding:40px 0;margin-top:40px;}
.footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;color:var(--text-3);font-size:13px;}

/* ---------- Search modal ---------- */
.search-overlay{position:fixed;inset:0;background:rgba(6,6,7,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.search-box{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.search-input-row{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border-soft);}
.search-input-row input{flex:1;background:none;border:none;color:var(--text-1);font-size:15px;outline:none;}
.search-results{max-height:50vh;overflow-y:auto;}
.search-result{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border-soft);gap:12px;}
.search-result:hover{background:var(--surface-2);}
.search-result .sr-title{font-size:14px;}
.search-result .sr-type{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);}
.search-empty{padding:30px 18px;text-align:center;color:var(--text-3);font-size:13.5px;}

/* ---------- Table ---------- */
