},

"light-turleri":{
  kicker:"07.01", subtitle:"Point, Sun, Spot ve Area: hangi ışık ne zaman kullanılır?",
  nedir:["Blender'da dört temel ışık nesnesi vardır. Point Light, tek bir noktadan her yöne eşit yayılan ışıktır (ampul gibi). Sun Light, sonsuz uzaklıktaki bir kaynaktan gelen paralel ışınlardır; konumu değil sadece yönü önemlidir. Spot Light, koni şeklinde yönlü bir ışıktır (el feneri, sahne spotu). Area Light ise dikdörtgen ya da daire gibi bir yüzeyden yayılan ışıktır (softbox, pencere) ve yumuşak gölgeler verir."],
  neden:["Işık, bir sahnenin ruh halini belirler. Doğru ışık türünü seçmek, gölgelerin sertliğini, ışığın yayılımını ve sahnenin gerçekçiliğini doğrudan etkiler; örneğin bir iç mekânda Sun kullanmak çoğu zaman sahneyi yapay gösterir."],
  kisayolAyrinti:[
    {label:"Point",text:"Her yöne yayılan nokta ışık. Ampul, mum, küçük lambalar."},
    {label:"Sun",text:"Paralel ışınlar; sadece yönü önemli. Güneş ışığı ve dış mekân sahneleri."},
    {label:"Spot",text:"Koni şeklinde yönlü ışık. El feneri, sahne spotu, araba farı."},
    {label:"Area",text:"Yüzeyden yayılan yumuşak ışık. Softbox, pencere, stüdyo ışığı."}
  ],
  kullanim:["Shift+A → Light menüsünden ışık türünü ekle.","Properties → Object Data (ampul ikonu) sekmesinden Power, Color ve Radius/Size değerlerini ayarla.","Radius/Size büyüdükçe gölge kenarları yumuşar: daha büyük bir ışık yüzeyi, daha yumuşak gölge demektir.","Sun için Power yerine Strength kullanılır; 1-5 arası tipik değerlerdir."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Point ışığı tavandaki çıplak ampul, Sun'ı güneş, Spot'u el feneri, Area'yı ise fotoğrafçının softbox'ı gibi düşün."},
  mistakes:{items:["Radius'u 0 bırakıp gölgelerin aşırı sert, 'bilgisayar üretimi' görünmesi.","Tüm ışık türlerinde aynı güç birimini beklemek — Sun'ın Strength değeri Watt cinsinden değildir."],
    fix:"Yumuşak gölge için Radius/Size'ı büyüt; Sun'da Strength'i 1-5 arasında dene, Point/Spot/Area'da ise sahnenin ölçeğine göre yüzlerce Watt normaldir."},
  tip:"Blender'ın varsayılan sahnesindeki Point ışığı 1000 W'tır; ölçeği metre cinsinden gerçekçi bir odada bu, iyi bir başlangıç noktasıdır. Sahnen büyüdükçe gücü de orantılı artırman gerekir.",
  memorize:{kv:["Point = ampul","Sun = güneş","Spot = el feneri","Area = softbox"],text:"Işık türü, gölgenin sertliğini ve ışığın yayılımını belirler."},
  next:"light-hdri"
},

"light-hdri":{
  kicker:"07.02", subtitle:"Tek bir görselle tüm sahneyi çevreden aydınlat.",
  nedir:["HDRI (High Dynamic Range Image), bir ortamın 360° panoramik ve çok geniş parlaklık aralığına sahip fotoğrafıdır. Blender'da World (Dünya) ayarlarındaki Environment Texture düğümüne yüklenen bir HDRI, sahneyi çevrenin gerçek ışığı ve yansımalarıyla aydınlatır."],
  neden:["Tek bir HDRI, hem yumuşak bir genel aydınlatma hem de metal ve cam yüzeylerde gerçekçi yansımalar sağlar. Özellikle ürün ve asset sunumlarında hızlı ve inandırıcı sonuç almanın en pratik yoludur."],
  kullanim:["Properties → World sekmesine gir, Surface → Color alanından Environment Texture seç.","Bir .hdr veya .exr dosyası yükle.","Strength ile ışık yoğunluğunu ayarla.","Shader Editor'da World moduna geçip bir Mapping düğümüyle HDRI'ı Z ekseninde döndürerek ışığın yönünü değiştir."],
  mistakes:{items:["HDRI'ı sadece ışık için kullanmak isteyip kamerada dev bir gökyüzü panoraması görmek.","Düşük çözünürlüklü bir HDRI'ı, keskin yansıma veren (düşük Roughness) yüzeylerde kullanıp pikselli yansımalar almak."],
    fix:"Arka planı gizlemek için Render Properties → Film → Transparent seçeneğini aç. Metalik ve parlak yüzeyler için en az 2K, tercihen 4K bir HDRI kullan."},
  tip:"HDRI tek başına yumuşak ama düz bir aydınlatma verir. Ürün ve karakter sunumlarında HDRI'a ek olarak bir Area Light ile yönlü bir key ışığı eklemek, görüntüye derinlik kazandırır.",
  memorize:{kv:["HDRI = 360° ışık + yansıma"],text:"HDRI, sahneyi çevre fotoğrafından aydınlatır ve yansımaları gerçekçi kılar."},
  next:"light-three-point"
},

"light-three-point":{
  kicker:"07.03", subtitle:"Sinemanın ve fotoğrafın en temel ışık düzeni: Key, Fill, Rim.",
  nedir:["Three Point Lighting, bir konuyu üç ışıkla aydınlatma düzenidir. Key Light ana ışıktır: en güçlü olandır ve sahnenin yönünü belirler, genelde konunun 45° yanında ve biraz yukarısındadır. Fill Light, key'in oluşturduğu gölgeleri yumuşatan, daha zayıf ve geniş bir ışıktır; karşı taraftan gelir. Rim (Back) Light ise konunun arkasından gelip kenarlarını parlatarak onu arka plandan ayırır."],
  neden:["Tek bir ışık konuyu düz ve sert gösterir; üçlü düzen hacim, derinlik ve ayrışma hissi verir. Bu düzeni bilmek, hemen her portre, ürün ve karakter sunumunun temelidir; portfolyo render'ları için de ilk başvurulan kurulumdur."],
  demo:"threepoint",
  kullanim:["Key: Area Light, konunun 45° yan ve yukarısında, en yüksek güçte.","Fill: karşı tarafta, key'in yaklaşık dörtte biri ile yarısı kadar güçte, hafif soğuk bir renkte.","Rim: konunun arkasında ve yukarısında; kenarlarda ince bir parlama çizgisi oluşturur.","Önce sadece Key'i aç, sonra Fill ve Rim'i sırayla ekleyerek farkı gözlemle."],
  mistakes:{items:["Fill'i key ile aynı güçte yapıp görüntüyü düzleştirmek — hacim hissi kaybolur.","Rim ışığını çok güçlü bırakıp konunun kenarlarının 'yanmış' (overexposed) görünmesi."],
    fix:"Oranı koru: Key en güçlü, Fill onun dörtte biri ile yarısı arasında, Rim ise kenarlarda ince bir parlama verecek seviyede olsun."},
  tip:"Sıcak bir key (hafif sarı) ile soğuk bir fill (hafif mavi) kullanmak, renk zıtlığıyla sinematik bir his verir.",
  memorize:{kv:["Key = şekillendirir","Fill = yumuşatır","Rim = ayırır"],text:"Üç ışık üç iş yapar: şekillendir, yumuşat, ayır."},
  next:"cam-lens"
},

"cam-lens":{
  kicker:"07.04", subtitle:"Lens seçimi, görüntünün ne kadarını göreceğini ve derinliğin nasıl hissedileceğini belirler.",
  nedir:["Blender kamerasında iki projeksiyon türü vardır: Perspective (insan gözü gibi; uzaktaki nesneler küçük görünür) ve Orthographic (perspektifsiz, teknik çizim gibi). Focal Length (odak uzaklığı, mm cinsinden) görüş açısını belirler: düşük değer (24mm) geniş açı, yüksek değer (85mm) dar açı yani tele demektir. Sensor Size (varsayılan 36mm) ile birlikte görüş açısı (FOV) hesaplanır."],
  neden:["Odak uzaklığı yalnızca 'yakınlaştırma' değildir. Konunun aynı boyutta görünmesini istediğinde lens uzadıkça kamerayı geriye çekmen gerekir ve bu durumda arka plan konuya doğru 'sıkışır' (perspective compression). Geniş açı derinliği abartır ve dinamik hissettirir; 85mm gibi telelar ise portre ve ürünlerde oranları doğal tutar."],
  demo:"lens",
  kullanim:["Camera Properties (kamera ikonu) → Lens → Focal Length değerini gir.","24mm: geniş açı, iç mekân, dramatik ve abartılı perspektif.","35mm: doğal ve çok yönlü, hikâye anlatımı için ideal.","50mm: insan gözüne yakın, nötr bir görünüm.","85mm: portre ve ürün; arka planı sıkıştırır, oranları güzel tutar.","Numpad 0 ile kamera görünümüne geç; Ctrl+Alt+Numpad 0 ile kamerayı mevcut viewport açına hizala."],
  mistakes:{items:["Portre veya ürün için çok geniş açı (24mm) kullanıp yakın kısımların şişmesi ve oranların bozulması.","Focal Length'i değiştirip kamerayı hareket ettirmeyi unutmak — konu kadraja sığmaz ya da çok küçük kalır."],
    fix:"Focal Length'i değiştirdikten sonra kamerayı ileri-geri hareket ettirerek konuyu yeniden kadrajla. Portre ve ürün için 50-85mm aralığında başla."},
  tip:"Ürün ve asset sunumlarında 50-85mm arası bir lens, temiz ve orantılı bir görünüm verir; oyun asset portfolyo render'larında bu aralık yaygın bir tercihtir.",
  memorize:{kv:["24mm = geniş","50mm = doğal","85mm = sıkıştırır"],text:"Focal Length, görüş açısını ve arka plan sıkışmasını birlikte belirler."},
  next:"cam-dof"
},

"cam-dof":{
  kicker:"07.05", subtitle:"Odak dışındaki bölgeleri bulanıklaştırarak izleyicinin bakışını yönlendir.",
  nedir:["Depth of Field (alan derinliği), görüntünün hangi mesafe aralığının net, hangisinin bulanık görüneceğini belirler. Blender'da Camera Properties → Depth of Field seçeneğini açıp Focus on Object (ya da Focus Distance) ve F-Stop (diyafram) ile kontrol edersin. F-Stop küçüldükçe (f/1.4) bulanıklık artar; büyüdükçe (f/16) her şey netleşir."],
  neden:["Sığ bir alan derinliği konuyu arka plandan ayırır ve sinematik, yakın plan bir his verir. Ürün sunumunda küçük objeleri daha büyük ve değerli gösterir. Yanlış odak ise konunun kendisini bulanık bırakır."],
  kullanim:["Camera Properties → Depth of Field kutusunu işaretle.","Focus on Object alanına konuyu seç (ya da Focus Distance'ı elle gir).","F-Stop'u düşürerek (örn. 1.8-2.8) bulanıklığı artır.","Eevee'de bu ayar Rendered görünümde canlı önizlenir; Cycles'ta render sırasında hesaplanır."],
  mistakes:{items:["Focus Distance'ı yanlış bırakıp konunun bulanık, arka planın net çıkması.","F-Stop'u aşırı düşürüp konunun sadece küçük bir kısmının (örneğin yalnızca gözlerin) net kalması."],
    fix:"Focus on Object ile konuyu doğrudan seç; F-Stop'a 2.8 civarından başlayıp sonucu gözle ayarla."},
  tip:"Sahne ölçeği DOF'u etkiler: çok küçük ölçekli (birkaç santimetrelik) objelerde bulanıklık aşırı görünebilir. Böyle durumlarda F-Stop'u yükselt.",
  memorize:{kv:["F-Stop düşük = çok bulanık","Focus = netlik mesafesi"],text:"Depth of Field, neyin net neyin bulanık görüneceğini ve izleyicinin bakışını yönetir."},
  next:"render-eevee-cycles"
},

  nedir:["Eevee gerçek zamanlı çalışan bir render motorudur: hızlıdır ve viewport'ta canlı sonuç verir; yansıma, gölge ve ortam aydınlatması gibi efektleri yaklaşık yöntemlerle üretir. Cycles ise path tracing tabanlıdır: ışık ışınlarını fiziksel olarak simüle eder, bu yüzden gölge, yansıma, kırılma ve global illumination daha doğrudur, ancak çok daha yavaştır. Blender 4.2 ve sonrasındaki yeni Eevee, ışın izleme seçenekleriyle bu iki dünya arasındaki farkı biraz kapatır."],

  table:{head:["Özellik","Eevee","Cycles"],rows:[

  tip:"Eevee ile Cycles arasında geçiş yaparken materyaller genelde olduğu gibi çalışır; bu yüzden iki motoru aynı sahnede rahatça karşılaştırabilirsin.",

"render-settings":{

  nedir:["Render ayarları görüntünün kalitesini, boyutunu ve dosya çıktısını belirler. Ana başlıklar şunlardır: Samples (örnekleme sayısı; Cycles'ta ne kadar çoksa gürültü o kadar azdır), Denoise (gürültü giderme), Resolution (Output Properties'te Resolution X/Y ve yüzde değeri), Color Management (View Transform ve Exposure) ve Output (dosya formatı, kayıt yeri)."],
  neden:["Varsayılan ayarlarla render almak çoğu zaman ya çok gürültülü ya da gereksiz uzun sonuç verir. Ayarları bilmek süreyi kısaltır ve görüntüyü temizler."],
  kullanim:["Render Properties → Sampling: Viewport için düşük (32-128), Render için daha yüksek (128-512) değerler kullan, Denoise açık olsun.","Output Properties → Resolution: örn. 1920×1080 ve %100. Hızlı testler için %50 kullan.","Color Management → View Transform: Filmic ya da AgX, parlak alanları daha doğal yumuşatır; genel parlaklığı Exposure ile ayarla.","F12 tek kare render alır, Ctrl+F12 animasyonu render eder. Sonucu Image → Save As ile kaydet."],
  mistakes:{items:["Test render'larını tam çözünürlük ve yüksek sample ile alıp zaman kaybetmek.","Render'ı kaydetmeyi unutup pencereyi kapatmak — Render penceresindeki görüntü otomatik kaydedilmez."],
    fix:"Denemeleri %25-50 çözünürlük ve düşük sample ile yap; final öncesi değerleri yükselt. Render bittiğinde Image → Save As (Shift+Alt+S) ile kaydetmeyi unutma."},
  tip:"Portfolyo görselleri için Film → Transparent ile PNG olarak arka plansız render alıp modeli istediğin arka plana yerleştirebilirsin.",
  memorize:{kv:["F12 = Render","Ctrl+F12 = Animasyon"],text:"Test için düşük, final için yüksek ayar: süreyi ve kaliteyi bu şekilde yönetirsin."},
  miniTask:{rules:["Önceki modüllerden bir modeli aç","Key, Fill ve Rim olarak üç Area Light kur","Kamerayı 85mm yapıp konuyu kadrajla","Eevee ile F12 render al ve kaydet"],
    solution:"Shift+A → Light → Area ekle (bunu üç kez yapıp Key, Fill, Rim olarak konumlandır). Camera Properties → Focal Length: 85. F12 ile render al, ardından Image → Save As."},
  next:"anim-keyframe"
},

"unreal-pipeline":{
  kicker:"11.01", subtitle:"Blender'da bitirdiğin bir asset'in Unreal Engine'de bir seviyeye kadar izlediği yolun büyük resmi.",
  nedir:["Bu pipeline, Blender içinde tamamladığın bir modelin adım adım Unreal Engine içinde kullanılabilir bir Static Mesh'e dönüşme sürecidir. Akış kabaca şöyledir: model tamamlanır → transform'lar uygulanır → UV ve materyaller hazırlanır → gerekiyorsa özel isimlendirilmiş bir collision mesh'i eklenir → FBX olarak dışa aktarılır → Unreal'in Content Browser'ına import edilir → import ayarları doğrulanır → seviyeye yerleştirilir ve gerekiyorsa bir Blueprint'e sarılır."],
  pipeline:[{label:"Model",icon:"📦"},{label:"Apply Transform",icon:"🧭"},{label:"UV + Material",icon:"🎨"},{label:"Collision (UCX_)",icon:"🧱"},{label:"Export FBX",icon:"📤"},{label:"UE Import",icon:"🎮"},{label:"Blueprint",icon:"🧩"}],
  neden:["Unreal Engine, Unity'ye göre daha 'stüdyo' bir iş akışına sahiptir: collision'ı genelde modelin bir parçası olarak Blender'da hazırlarsın; doğru isimlendirme kuralına (UCX_) uyarsan Unreal bunu import sırasında otomatik tanır. Bu pipeline'ı bir bütün olarak görmek, hangi adımın nerede yapılacağını netleştirir."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Bu pipeline'ı bir binanın inşaat ruhsatı sürecine benzetebilirsin: önce proje çizilir (model), ölçüler onaylanır (apply transform), güvenlik sınırları belirlenir (collision), evraklar dosyalanır (export), belediyeye teslim edilir (import) ve ancak o zaman kullanıma açılır (Blueprint / seviyeye yerleştirme)."},
  mistakes:{items:["Collision mesh'ini Unreal tarafında sonradan elle çizmeye çalışıp, aslında Blender'da isimlendirme kuralıyla çok daha hızlı hazırlanabilecek bir işi zorlaştırmak."],
    fix:"Basit collision ihtiyaçların için Blender'da UCX_ önekiyle bir collision mesh'i hazırlamak, Unreal'in bunu import sırasında otomatik tanımasını sağlar ve elle Unreal içinde collision çizmekten çok daha hızlıdır."},
  tip:"İlk asset'ini Unreal'e aktarırken de, Unity dersinde yaptığın gibi 1×1×1 metrelik bir test küpüyle pipeline'ı baştan sona dene; ölçek burada da kritik, çünkü Unreal'in varsayılan birimi 1 Unreal Unit = 1 santimetredir — Blender'ın metre biriminden farklıdır.",
  memorize:{kv:["Model → Collision → Export → Import → Blueprint"],text:"Blender → Unreal pipeline'ı, collision'ı genelde Blender tarafında hazırlayan bir üretim hattıdır."},
  next:"unreal-fbx-export"
},

"unreal-fbx-export":{
  kicker:"11.02", subtitle:"Unreal'in bekleneni gördüğünden emin olmak için FBX ayarlarını ve collision hazırlığını doğru yap.",
  nedir:["FBX export penceresi burada da Blender ile Unreal arasındaki köprüdür; ama Unreal'e özgü iki ek konu vardır: ölçek birimi farkı (Blender = metre, Unreal = santimetre) ve collision mesh'lerin isimlendirme kuralıyla otomatik tanınması."],
  neden:["Ölçek birimi gözden kaçarsa model Unreal'de olduğundan çok küçük ya da çok büyük görünebilir; collision isimlendirmesi doğru yapılmazsa Unreal modeli varsayılan olarak çarpışmasız (ya da çok kaba bir otomatik collision'la) içeri alır."],
  kullanim:["Export öncesi Ctrl+A → All Transforms uygulaman burada da geçerlidir — Unity dersindeki aynı prensip.",
    "Collision için: modelinin adı 'Kapi' ise, basit bir collision hacmini (genelde birkaç kutu/kapsülden oluşan ayrı bir mesh) 'UCX_Kapi' adıyla, aynı sahnede ve aynı pivot noktasında hazırla; Unreal, FBX'i import ederken bu ismi otomatik olarak collision olarak tanır.",

/* ---------------- NAV / SHELL ---------------- */
const NAV_ITEMS = [
  {href:"#/dersler",label:"Dersler"},
  {href:"#/yol-haritasi",label:"Yol Haritası"},
  {href:"#/projeler",label:"Projeler"},
  {href:"#/kisayollar",label:"Kısayollar"},

];
function levelBadge(level){
  const map = {0:["🟢 Başlangıç","badge-level-0"],1:["🟡 Orta","badge-level-1"],2:["🔴 İleri","badge-level-2"]};
  const [label,cls] = map[level]||map[0];
  return `<span class="badge ${cls}">${label}</span>`;
}
function renderTopNav(currentHash){
  const links = NAV_ITEMS.map(it=>`<a class="nav-link ${currentHash.startsWith(it.href)?'active':''}" href="${it.href}">${it.label}</a>`).join("");
  return `<header class="topnav">
    <div class="topnav-inner">
      <a href="#/" class="brand"><span class="brand-mark">B</span>Blender Academy</a>
      <nav class="nav-links">${links}</nav>
      <div class="nav-right">
        <button class="icon-btn" id="btn-search" aria-label="Ara" title="Ara (site genelinde)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn hamburger" id="btn-drawer" aria-label="Menü">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-drawer" class="hidden" style="border-top:1px solid var(--border-soft);padding:10px 20px 16px;">
      ${NAV_ITEMS.map(it=>`<a class="nav-link" style="display:block;padding:11px 6px;" href="${it.href}">${it.label}</a>`).join("")}
    </div>
  </header>`;
}
function renderSidebar(activeSlug){
  const done = state.completedLessons;
  const modsHtml = MODULES.map(m=>{
    const lessons = m.lessons.map(l=>{
      const isDone = done.includes(l.slug);
      const isActive = l.slug===activeSlug;
      const locked = !!l.locked;
      return `<a href="${locked?'#':'#/dersler/'+l.slug}" class="side-lesson ${isActive?'active':''} ${isDone?'done':''} ${locked?'locked':''}" ${locked?'data-locked="1"':''}>
        <span class="dot"></span>${esc(l.title)}${locked?' <span class="text-3" style="margin-left:auto;font-size:11px;">🔒</span>':''}
      </a>`;
    }).join("");
    return `<div class="side-mod">
      <div class="side-mod-head">${esc(m.title)}</div>
      <div class="side-mod-lessons">${lessons}</div>
    </div>`;
  }).join("");
  return `<aside class="side" id="side-nav"><div class="side-title">Blender Academy</div>${modsHtml}</aside>`;
}
function renderShell(mainHtml, opts){
  opts = opts||{};
  if(opts.withSidebar){
    return `<div class="app-shell">
      ${renderSidebar(opts.activeSlug)}
      <main class="content-main">
        <button class="mobile-side-toggle" id="btn-side-toggle">☰ Ders Listesi</button>
        ${mainHtml}
      </main>
    </div>`;
  }
  return `<main>${mainHtml}</main>`;
}
function renderFooter(){

/* ---------------- ROUTER ---------------- */
const routes = [];
function route(pattern, handler){ routes.push({pattern,handler}); }
function matchRoute(hash){
  for(const r of routes){
    const m = hash.match(r.pattern);
    if(m) return {handler:r.handler, params:m.slice(1)};
  }
  return null;
}
let activeDemoCleanup = null;
function render(){
  const hash = location.hash || "#/";
  const app = qs("#app");
  if(activeDemoCleanup){ try{activeDemoCleanup();}catch(e){} activeDemoCleanup=null; }
  const match = matchRoute(hash);
  const body = match ? match.handler(...match.params) : page404();
  app.innerHTML = renderTopNav(hash) + body.html + (body.noFooter?"":renderFooter());
  window.scrollTo({top:0,behavior:"instant"});
  wireGlobalEvents(hash);
  if(body.after) body.after();
}
window.addEventListener("hashchange", render);

function stepProgressFor(slug, steps){
  if(!steps || !steps.length) return {done:0,total:0,pct:0};
  const done = steps.filter(s=>isStepDone(slug,s.id)).length;
  return {done, total:steps.length, pct:Math.round(done/steps.length*100)};
}

function openSearch(){
  const overlay = document.createElement("div");
  overlay.className = "search-overlay";
  overlay.id = "search-overlay";
  overlay.innerHTML = `<div class="search-box">
    <div class="search-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" placeholder="Ders, kısayol ya da proje ara..." autofocus>
    </div>
    <div class="search-results" id="search-results"><div class="search-empty">Aramaya başlamak için yaz...</div></div>
  </div>`;
  document.body.appendChild(overlay);
  const input = qs("#search-input", overlay);
  input.focus();
  overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  document.addEventListener("keydown", escCloseOnce);
  function escCloseOnce(e){ if(e.key==="Escape"){ overlay.remove(); document.removeEventListener("keydown", escCloseOnce); } }
  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    const results = qs("#search-results", overlay);
    if(!q){ results.innerHTML = '<div class="search-empty">Aramaya başlamak için yaz...</div>'; return; }
    let hits = [];
    allLessonsFlat().forEach(l=>{
      if(l.locked) return;
      const c = LESSON_CONTENT[l.slug]||{};
      const hay = (l.title+" "+(c.subtitle||"")).toLowerCase();
      if(hay.includes(q)) hits.push({type:"Ders",title:l.title,href:"#/dersler/"+l.slug});
    });
    SHORTCUTS.forEach(s=>{
      if((s.name+" "+s.key+" "+s.desc).toLowerCase().includes(q)) hits.push({type:"Kısayol",title:s.name+" ("+s.key+")",href:"#/kisayollar"});
    });
    PROJECTS.forEach(p=>{
      if((p.title+" "+p.desc).toLowerCase().includes(q)) hits.push({type:"Proje",title:p.title,href:"#/projeler/"+p.slug});
    });
    hits = hits.slice(0,20);
    results.innerHTML = hits.length ? hits.map(h=>`<a class="search-result" href="${h.href}"><span class="sr-title">${esc(h.title)}</span><span class="sr-type">${h.type}</span></a>`).join("") : '<div class="search-empty">Eşleşen sonuç bulunamadı.</div>';
    qsa(".search-result", results).forEach(a=>a.addEventListener("click", ()=>overlay.remove()));
  });
}

      before.style.clipPath = `inset(0 ${100-pct}% 0 0)`;
      handle.style.left = pct+"%";
    }
    function fromClientX(clientX){
      const rect = compareBox.getBoundingClientRect();
      setPct(((clientX-rect.left)/rect.width)*100);
    }
    handle.addEventListener("mousedown", ()=>dragging=true);
    window.addEventListener("mousemove", e=>{ if(dragging) fromClientX(e.clientX); });
    window.addEventListener("mouseup", ()=>dragging=false);
    handle.addEventListener("touchstart", ()=>dragging=true, {passive:true});
    window.addEventListener("touchmove", e=>{ if(dragging) fromClientX(e.touches[0].clientX); }, {passive:true});
    window.addEventListener("touchend", ()=>dragging=false);
    compareBox.addEventListener("click", e=>{ if(e.target===handle) return; fromClientX(e.clientX); });
    setPct(50);
  }
}

/* ---------------- THREE.JS SAHNELERİ ---------------- */
function makeManualOrbit(canvasWrap, camera, renderFn, radius, initTheta, initPhi){
  let theta = initTheta!==undefined?initTheta:0.7, phi = initPhi!==undefined?initPhi:1.05;
  let dragging=false, lastX=0, lastY=0;
  function updateCam(){
    const r = radius;
    camera.position.set(r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(0,0,0);
  }
  function onDown(e){ dragging=true; const p=(e.touches?e.touches[0]:e); lastX=p.clientX; lastY=p.clientY; }
  function onMove(e){
    if(!dragging) return;
    const p=(e.touches?e.touches[0]:e);
    const dx=p.clientX-lastX, dy=p.clientY-lastY; lastX=p.clientX; lastY=p.clientY;
    theta -= dx*0.008; phi -= dy*0.008;
    phi = Math.max(0.25, Math.min(Math.PI-0.25, phi));
    updateCam(); renderFn();
  }
  function onUp(){ dragging=false; }
  canvasWrap.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvasWrap.addEventListener("touchstart", onDown, {passive:true});
  canvasWrap.addEventListener("touchmove", onMove, {passive:true});
  window.addEventListener("touchend", onUp);
  updateCam();
  return {
    dispose(){
      canvasWrap.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      canvasWrap.removeEventListener("touchstart", onDown);
      canvasWrap.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
    },
    setAutorotate(v){ /* no-op placeholder */ }
  };
}

function initHeroScene(){
  const wrap = qs("#hero-stage");
  if(!wrap || typeof THREE==="undefined") return;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, wrap.clientWidth/wrap.clientHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  wrap.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);
  const geo = new THREE.BoxGeometry(1.6,1.6,1.6);
  const wireGeo = new THREE.EdgesGeometry(geo);
  const wireMat = new THREE.LineBasicMaterial({color:0xff7a1f});
  const wireCube = new THREE.LineSegments(wireGeo, wireMat);
  group.add(wireCube);

  const solidMat = new THREE.MeshBasicMaterial({color:0x1a1a1f, transparent:true, opacity:0.55});
  const solidCube = new THREE.Mesh(geo, solidMat);
  group.add(solidCube);

  // etraftaki küçük primitive'ler (dekoratif, hafif)
  const deco = new THREE.Group();
  const smallGeo = new THREE.BoxGeometry(0.35,0.35,0.35);
  for(let i=0;i<5;i++){
    const m = new THREE.LineSegments(new THREE.EdgesGeometry(smallGeo), new THREE.LineBasicMaterial({color:0x55555f}));
    const a = (i/5)*Math.PI*2;
    m.position.set(Math.cos(a)*2.6, Math.sin(a*1.3)*0.6, Math.sin(a)*2.6);
    deco.add(m);
  }
  scene.add(deco);

  camera.position.set(2.6,1.8,2.6);
  camera.lookAt(0,0,0);

  let raf;
  function draw(){ renderer.render(scene, camera); }
  function loop(){
    group.rotation.y += 0.0035;
    deco.rotation.y -= 0.0018;
    draw();
    raf = requestAnimationFrame(loop);
  }
  loop();

  const orbit = makeManualOrbit(wrap, camera, draw, 5.2, 0.9, 1.1);

  function onResize(){
    if(!wrap.isConnected) return;
    camera.aspect = wrap.clientWidth/wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  }
  window.addEventListener("resize", onResize);

  activeDemoCleanup = chainCleanup(activeDemoCleanup, ()=>{
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", onResize);
    orbit.dispose();
    renderer.dispose();
  });
}
function chainCleanup(prev, fn){ return ()=>{ if(prev) prev(); fn(); }; }

function mountTransformDemo(){
  const base = baseThreeSetup("demo-canvas-transform");
  if(!base) return;
  const {wrap, scene, camera, renderer, onResize} = base;
  const geo = new THREE.BoxGeometry(1.4,1.4,1.4);
  const mat = new THREE.MeshStandardMaterial({color:0x2a2a30, roughness:0.55, metalness:0.15});
  const cube = new THREE.Mesh(geo, mat);
  scene.add(cube);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0xff7a1f}));
  cube.add(edges);
  camera.position.set(3.2,2.2,3.6);
  function draw(){ renderer.render(scene,camera); }
  const orbit = makeManualOrbit(wrap, camera, draw, 5.2, 0.8, 1.05);

  let raf, anim = null;
  const base_pos = {x:0,y:0,z:0}, base_rot = 0, base_scale = 1;
  function loop(){
    if(anim){
      anim.t += 0.045;
      const k = Math.min(anim.t,1);
      const ek = 1-Math.pow(1-k,3);
      if(anim.type==="move") cube.position.x = ek*anim.target;
      if(anim.type==="rotate") cube.rotation.y = ek*anim.target;
      if(anim.type==="scale"){ const s = 1+(anim.target-1)*ek; cube.scale.set(s,s,s); }
      if(k>=1) anim=null;
    }
    draw();
    raf = requestAnimationFrame(loop);
  }
  loop();

  function reset(){ cube.position.set(0,0,0); cube.rotation.set(0,0,0); cube.scale.set(1,1,1); anim=null; }
  qsa("[data-tf]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const t = btn.getAttribute("data-tf");
      if(t==="move") anim = {type:"move", t:0, target: cube.position.x>0.5?0:2};
      if(t==="rotate") anim = {type:"rotate", t:0, target: cube.rotation.y+Math.PI/2};
      if(t==="scale") anim = {type:"scale", t:0, target: cube.scale.x>1.2?1:1.6};
      if(t==="reset") reset();
    });
  });

  activeDemoCleanup = chainCleanup(activeDemoCleanup, ()=>{
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", onResize);
    orbit.dispose();
    renderer.dispose();
  });
}

/* --- DEMO 3: BEVEL (gerçek vertex-tabanlı rounded-box) --- */
function roundedVertex(x,y,z,b,r){
  const limit = Math.max(b-r, 0);
  const cx = Math.max(-limit, Math.min(limit, x));
  const cy = Math.max(-limit, Math.min(limit, y));
  const cz = Math.max(-limit, Math.min(limit, z));
  let dx=x-cx, dy=y-cy, dz=z-cz;
  const len = Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(len>1e-6){ const s = r/len; dx*=s; dy*=s; dz*=s; }
  return [cx+dx, cy+dy, cz+dz];
}
function buildBevelGeo(segments){
  const size = 1.5, half = size/2;
  const geo = new THREE.BoxGeometry(size,size,size,segments,segments,segments);
  const pos = geo.attributes.position;
  const orig = new Float32Array(pos.array);
  geo.userData.orig = orig;
  geo.userData.half = half;
  return geo;
}
function applyBevelAmount(geo, amountFrac){
  const pos = geo.attributes.position;
  const orig = geo.userData.orig;
  const half = geo.userData.half;
  const r = amountFrac * half * 0.92;
  for(let i=0;i<pos.count;i++){
    const x=orig[i*3], y=orig[i*3+1], z=orig[i*3+2];
    const [nx,ny,nz] = r>0.001 ? roundedVertex(x,y,z,half,r) : [x,y,z];
    pos.setXYZ(i, nx, ny, nz);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

/* --- DEMO 4: BOOLEAN (gerçek geometrik delik — extrude+hole) --- */
function buildBoxWithHoleGeo(size, holeRadius){
  const half = size/2;
  const shape = new THREE.Shape();
  shape.moveTo(-half,-half);
  shape.lineTo(half,-half);
  shape.lineTo(half,half);
  shape.lineTo(-half,half);
  shape.lineTo(-half,-half);
  const holePath = new THREE.Path();
  holePath.absarc(0,0,holeRadius,0,Math.PI*2,false);
  shape.holes.push(holePath);
  const geo = new THREE.ExtrudeGeometry(shape, {depth:size, bevelEnabled:false, curveSegments:24});
  geo.translate(0,0,-half);
  geo.rotateX(Math.PI/2);
  return geo;
}

/* --- DEMO 10: UNWRAP (küp neti açılım animasyonu) --- */
function mountUnwrapDemo(){
  const base = baseThreeSetup("demo-canvas-unwrap");
  if(!base) return;
  const {wrap, scene, camera, renderer, onResize} = base;

  const colors = {front:0xff7a1f, back:0x4f8ef0, top:0x3ec98a, bottom:0xe8b339, left:0xe0574f, right:0xa855f7};
  const faceDefs = {
    front: {foldedPos:[0,0,0], foldedEuler:[0,0,0], unfoldedPos:[0,0,0]},
    back:  {foldedPos:[0,0,-1], foldedEuler:[0,Math.PI,0], unfoldedPos:[2,0,0]},
    top:   {foldedPos:[0,0.5,-0.5], foldedEuler:[-Math.PI/2,0,0], unfoldedPos:[0,1,0]},
    bottom:{foldedPos:[0,-0.5,-0.5], foldedEuler:[Math.PI/2,0,0], unfoldedPos:[0,-1,0]},
    left:  {foldedPos:[-0.5,0,-0.5], foldedEuler:[0,-Math.PI/2,0], unfoldedPos:[-1,0,0]},
    right: {foldedPos:[0.5,0,-0.5], foldedEuler:[0,Math.PI/2,0], unfoldedPos:[1,0,0]},
  };
  const group = new THREE.Group();
  scene.add(group);
  const meshes = {};
  Object.keys(faceDefs).forEach(k=>{
    const geo = new THREE.PlaneGeometry(0.94,0.94);
    const mat = new THREE.MeshStandardMaterial({color:colors[k], roughness:0.6, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0x0a0a0c})));
    const d = faceDefs[k];
    mesh.position.set(...d.unfoldedPos);
    mesh.userData.foldedQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(...d.foldedEuler));
    mesh.userData.unfoldedQuat = new THREE.Quaternion();
    mesh.userData.foldedPos = new THREE.Vector3(...d.foldedPos);
    mesh.userData.unfoldedPos = new THREE.Vector3(...d.unfoldedPos);
    group.add(mesh);
    meshes[k] = mesh;
  });

  camera.position.set(2.4,1.8,3.6);
  function draw(){ renderer.render(scene,camera); }
  const orbit = makeManualOrbit(wrap, camera, draw, 5.4, 0.75, 1.1);

  let raf, t=1, dir=1, animating=false, folded=true;
  function applyT(){
    Object.values(meshes).forEach(m=>{
      const ek = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; // ease in-out
      m.position.lerpVectors(m.userData.unfoldedPos, m.userData.foldedPos, ek);
      m.quaternion.slerpQuaternions(m.userData.unfoldedQuat, m.userData.foldedQuat, ek);
    });
  }
  applyT();
  function loop(){
    if(animating){
      t += 0.03*dir;
      t = Math.max(0, Math.min(1,t));
      applyT();
      if(t<=0||t>=1){ animating=false; folded = t>=1; }
    }
    group.rotation.y += 0.0015;
    draw();
    raf = requestAnimationFrame(loop);
  }
  loop();

  const btn = qs("#unwrap-toggle");
  if(btn){
    btn.addEventListener("click", ()=>{
      const willBeFolded = !folded;
      dir = folded ? -1 : 1;
      animating = true;
      btn.textContent = willBeFolded ? "Aç (Unwrap)" : "Katla (Fold)";
    });
  }

  activeDemoCleanup = chainCleanup(activeDemoCleanup, ()=>{
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", onResize);
    orbit.dispose();
    renderer.dispose();
  });
}

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.9,48,48), mat);
  head.position.y = 0.2;
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.16,0.4,24), mat);
  nose.rotation.x = Math.PI/2; nose.position.set(0,0.2,1.05);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(3,48), new THREE.MeshStandardMaterial({color:0x17171b, roughness:0.9}));
  floor.rotation.x = -Math.PI/2; floor.position.y = -0.7;
  scene.add(head); scene.add(nose); scene.add(floor);

  function draw(){ renderer.render(scene,camera); }
  const orbit = makeManualOrbit(wrap, camera, draw, 5.6, 0.45, 1.3);
  let raf;
  function loop(){ draw(); raf = requestAnimationFrame(loop); }
  loop();

  const map = {key, fill, rim};
  qsa("[data-tp]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const L = map[btn.getAttribute("data-tp")];
      L.visible = !L.visible;
      btn.classList.toggle("btn-primary", L.visible);
      btn.classList.toggle("btn-ghost", !L.visible);
    });
  });

  activeDemoCleanup = chainCleanup(activeDemoCleanup, ()=>{
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", onResize);
    orbit.dispose();
    renderer.dispose();
  });
}

/* --- DEMO 12: LENS / FOCAL LENGTH --- */
function mountLensDemo(){
  const base = baseThreeSetup("demo-canvas-lens");
  if(!base) return;
  const {wrap, scene, camera, renderer, onResize} = base;
  const hint = qs(".demo-hint", wrap); if(hint) hint.textContent = "odak uzaklığını seç";

  const subj = new THREE.Mesh(new THREE.SphereGeometry(0.5,40,40), new THREE.MeshStandardMaterial({color:0xff7a1f, roughness:0.45}));
  subj.position.y = 0.5; scene.add(subj);
  const bgMat = new THREE.MeshStandardMaterial({color:0x3a3a42, roughness:0.6});
  for(let i=1;i<=6;i++){
    [-1,1].forEach(side=>{
      const h = 1 + (i%2)*0.6;
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.5,h,0.5), bgMat);
      b.position.set(side*(1.2+i*0.05), h/2, -i*1.6);
      scene.add(b);
    });
  }
  scene.add(new THREE.GridHelper(40,40,0x55555f,0x2a2a30));

  let fCur = 50, fTarget = 50;
  const readout = qs("#lens-readout");
  function hfovOf(f){ return 2*Math.atan(18/f); }
  function applyLens(f){
    const hf = hfovOf(f);
    const vf = 2*Math.atan(Math.tan(hf/2)/camera.aspect);
    camera.fov = vf*180/Math.PI;
    camera.updateProjectionMatrix();
    camera.position.set(0,0.9,0.11*f);
    camera.lookAt(0,0.5,0);
  }
  function setReadout(){
    if(readout) readout.textContent = fTarget+" mm · yatay FOV "+(hfovOf(fTarget)*180/Math.PI).toFixed(0)+"°";
  }
  applyLens(fCur); setReadout();

  let raf;
  function loop(){
    fCur += (fTarget-fCur)*0.12;
    if(Math.abs(fTarget-fCur)<0.05) fCur = fTarget;
    applyLens(fCur);
    renderer.render(scene,camera);
    raf = requestAnimationFrame(loop);
  }
  loop();

  qsa("#lens-btns button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      qsa("#lens-btns button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      fTarget = +btn.getAttribute("data-mm");
      setReadout();
    });
  });

  activeDemoCleanup = chainCleanup(activeDemoCleanup, ()=>{
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", onResize);
    renderer.dispose();
  });
}

function findLessonMeta(slug){
  for(const m of MODULES){ const l=m.lessons.find(x=>x.slug===slug); if(l) return {...l, moduleId:m.id, moduleTitle:m.title}; }
  return null;
}
function allLessonsFlat(){
  const out=[]; MODULES.forEach(m=>m.lessons.forEach(l=>out.push({...l,moduleId:m.id,moduleTitle:m.title}))); return out;
}

/* ---------------- STATE / STORAGE ---------------- */
const STORAGE_KEY = "blenderAcademy.progress.v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {completedLessons:[], completedSteps:{}};
    const parsed = JSON.parse(raw);
    return {completedLessons:parsed.completedLessons||[], completedSteps:parsed.completedSteps||{}};
  }catch(e){ return {completedLessons:[], completedSteps:{}}; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* depolama kullanılamıyor */ }
}
let state = loadState();
function isLessonDone(slug){ return state.completedLessons.includes(slug); }
function toggleLessonDone(slug){
  const i = state.completedLessons.indexOf(slug);
  if(i>=0) state.completedLessons.splice(i,1); else state.completedLessons.push(slug);
  saveState();
}
function isStepDone(lessonSlug, stepId){
  return (state.completedSteps[lessonSlug]||[]).includes(stepId);
}
function toggleStep(lessonSlug, stepId){
  if(!state.completedSteps[lessonSlug]) state.completedSteps[lessonSlug]=[];
  const arr = state.completedSteps[lessonSlug];
  const i = arr.indexOf(stepId);
  if(i>=0) arr.splice(i,1); else arr.push(stepId);
  saveState();
}

function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

/* ---------------- SVG TEKNİK DİYAGRAMLAR ---------------- */
// İzometrik küp: köşeler (vertex), kenarlar (edge), yüzeyler (face) anlatımı için.
const CUBE_PTS = { T:[100,66], L:[38,100], R:[162,100], F:[100,134], BL:[38,162], BR:[162,162], BF:[100,196] };
const CUBE_EDGES = [["T","L"],["T","R"],["T","F"],["L","F"],["R","F"],["L","BL"],["R","BR"],["F","BF"],["BL","BF"],["BR","BF"]];
function svgCubeBase(){
  let edges = CUBE_EDGES.map(([a,b])=>`<line x1="${CUBE_PTS[a][0]}" y1="${CUBE_PTS[a][1]}" x2="${CUBE_PTS[b][0]}" y2="${CUBE_PTS[b][1]}" stroke="var(--border)" stroke-width="1.6"/>`).join("");
  let dots = Object.values(CUBE_PTS).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="var(--text-3)"/>`).join("");
  return {edges,dots};
}
function svgCube(mode){
  const {edges,dots} = svgCubeBase();
  let extra = "";
  if(mode==="vertex"){
    extra = `<circle cx="${CUBE_PTS.F[0]}" cy="${CUBE_PTS.F[1]}" r="7" fill="var(--accent)"/>
      <circle cx="${CUBE_PTS.F[0]}" cy="${CUBE_PTS.F[1]}" r="13" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.5"/>
      <text x="${CUBE_PTS.F[0]+16}" y="${CUBE_PTS.F[1]+6}" fill="var(--accent)" font-family="JetBrains Mono" font-size="12">Vertex</text>`;
  } else if(mode==="edge"){
    extra = `<line x1="${CUBE_PTS.L[0]}" y1="${CUBE_PTS.L[1]}" x2="${CUBE_PTS.F[0]}" y2="${CUBE_PTS.F[1]}" stroke="var(--accent)" stroke-width="3.5"/>
      <text x="55" y="128" fill="var(--accent)" font-family="JetBrains Mono" font-size="12">Edge</text>`;
  } else if(mode==="face"){
    extra = `<polygon points="${CUBE_PTS.R.join(',')} ${CUBE_PTS.F.join(',')} ${CUBE_PTS.BF.join(',')} ${CUBE_PTS.BR.join(',')}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
      <text x="135" y="170" fill="var(--accent)" font-family="JetBrains Mono" font-size="12">Face</text>`;
  }
  return `<svg viewBox="0 0 210 220" width="100%" height="220">${edges}${dots}${extra}</svg>`;
}

function svgModes(){

    </div>
  </div>`;
}
