  neden:["Viewport'ta rahat hareket edemiyorsan, en basit modelleme işlemi bile yorucu hale gelir. Bu yüzden bu dersi atlamadan, gerçekten fareyle deneyerek geçmeni öneririz."],
  kullanim:["Orbit: Orta fare tuşu + sürükle","Pan: Shift + Orta fare tuşu + sürükle","Zoom: Fare tekerleği veya Ctrl + Orta fare tuşu + sürükle","Seçili objeye odaklan: Numpad . (nokta)"],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Viewport'u, elinde tuttuğun bir maketin etrafında dönerek onu incelediğin an gibi düşün. Sen hareket etmiyorsun, objenin etrafında dönen bir kamerayı yönetiyorsun."},
  memorize:{kv:["Numpad 1 = Ön","Numpad 3 = Sağ","Numpad 7 = Üst","Numpad 0 = Kamera"],text:"Bu dört görünüm, modelleme sırasında en çok kullanacağın açılardır."},
  next:"eksenler"
},

"eksenler":{
  kicker:"01.04", subtitle:"Üç boyutlu uzayda konum, Blender'ın en temel dilidir.",
  nedir:["Blender'da her nokta üç sayı ile tanımlanır: X, Y ve Z. X ekseni sağ-sol yönünü, Y ekseni ön-arka (derinlik) yönünü, Z ekseni ise yukarı-aşağı yönünü temsil eder. Bu üç eksen birbirine dik açıdadır ve üç boyutlu uzayı tanımlar.",
    "Blender'da Z ekseni 'yukarı' yönünü gösterir — bu, birçok diğer 3D yazılımdan (Y'nin yukarı olduğu) farklı bir kuraldır ve Unreal Engine'e aktarım yaparken dikkat etmen gereken noktalardan biridir."],
  visual:"axes",
  neden:["Move, Rotate ve Scale gibi neredeyse her komut bir eksen ister. 'S → X → 2' dediğinde Blender'a 'sadece X ekseninde 2 kat büyüt' dersin. Eksenleri anlamadan bu komutları doğru kullanamazsın."],
  kullanim:["Bir işlemi tek eksene kilitlemek için: komut tuşuna bastıktan sonra X, Y veya Z tuşuna bas.",
    "İki eksene aynı anda kilitlemek için: Shift + eksen tuşu (örneğin Shift+Z, X ve Y'yi serbest bırakıp Z'yi kilitler)."],
  memorize:{kv:["X = kırmızı, sağ-sol","Y = yeşil, ön-arka","Z = mavi, yukarı-aşağı"],text:"Blender'da Z her zaman yukarıdır."},
  mistakes:{items:["Eksen kısıtlamadan taşıma/döndürme yaparak objeyi istemeden başka eksene kaydırmak."],fix:"Bir transform sırasında her zaman hangi eksende çalıştığını ekranın sol alt köşesindeki bilgi çubuğundan kontrol et."},
  next:"object-nedir"
},

"object-nedir":{
  kicker:"01.05", subtitle:"Sahnendeki her şeyin temel birimi.",
  nedir:["Blender'da sahnendeki her öğe (bir küp, bir ışık, bir kamera, hatta boş bir yön işareti) bir 'Object'tir. Her objenin kendi konumu (location), döndürmesi (rotation) ve ölçeği (scale) vardır; bunlar Object Mode'da düzenlenir.",
    "Bir obje, içindeki geometriden (mesh) ayrı bir kavramdır: obje, o geometriyi sahnede nerede ve nasıl konumlandırdığını tutan bir 'zarf' gibidir."],
  neden:["Bu ayrımı anlamak ileride Modifier ve Instance (çoğaltma) gibi konularda kafa karışıklığını önler: aynı mesh verisini birden fazla objede paylaşmak mümkündür."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Bir Object'i, içine bir heykel (mesh) yerleştirdiğin bir sehpa gibi düşün. Sehpayı taşıyabilir, döndürebilirsin; heykelin kendisi bambaşka bir konudur."},
  next:"mesh-nedir"
},

"mesh-nedir":{
  kicker:"01.06", subtitle:"Bir objenin görünür şeklini oluşturan geometri verisi.",
  nedir:["Mesh, bir objenin şeklini tanımlayan noktalar, çizgiler ve yüzeylerden oluşan veri yapısıdır. Bir küp objesinin şekli, aslında 8 noktadan (vertex), bu noktaları birleştiren 12 çizgiden (edge) ve bunların oluşturduğu 6 yüzeyden (face) ibarettir.",
    "Modelleme yaptığında aslında objeyi değil, o objenin mesh verisini; yani bu vertex/edge/face bütününü değiştirirsin."],
  neden:["'Mesh' kelimesini bu platform boyunca sürekli göreceksin. Extrude, Bevel, Loop Cut gibi tüm modelleme araçları mesh üzerinde çalışır."],
  memorize:{kv:["Mesh = geometri verisi","Vertex + Edge + Face = mesh"],text:"Bir objenin 'şekli', o objenin mesh'idir."},
  next:"vertex-edge-face"
},

"vertex-edge-face":{
  kicker:"01.07", subtitle:"Bir mesh'in üç temel yapı taşı.",
  nedir:["Bir mesh üç temel elemandan oluşur. Vertex (köşe noktası): uzayda tek bir konumu belirten noktadır, hiçbir boyutu yoktur. Edge (kenar): iki vertex'i birbirine bağlayan düz çizgidir. Face (yüzey): en az üç edge'in kapattığı düz alandır ve modelin görünen yüzeyini oluşturur."],
  visual:"vertex",
  neden:["Modelleme araçlarının neredeyse tamamı bu üç elemandan birini seçip üzerinde işlem yapmanı ister. Extrude bir face'i çıkarır, Bevel bir edge'i yumuşatır, Merge iki vertex'i birleştirir. Bu üçlüyü anlamadan hiçbir modelleme aracını doğru kullanamazsın."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Bir çadırı düşün: kazıkların battığı noktalar vertex, kazıklar arasındaki ipler edge, ipler arasında gerilen bez ise face'tir."},
  kullanim:["Edit Mode'a girdiğinde viewport üstünde üç küçük ikon görürsün: Vertex Select (1), Edge Select (2), Face Select (3). Bu tuşlarla hangi eleman türünü seçtiğini değiştirirsin."],
  mistakes:{items:["Yanlış seçim modunda (örneğin face yerine vertex) bir işlem uygulamaya çalışmak.","Sadece tek bir elemanı seçip, aslında birden fazla eleman gerektiren bir komutu (örneğin Bridge) çalıştırmaya çalışmak."],fix:"İşlem başarısız olduğunda önce hangi seçim modunda olduğunu (1/2/3 tuşları) kontrol et."},
  tip:"Bir yüzeyi yumuşak göstermek istediğinde çoğu zaman geometriyi değil, 'Shade Smooth' ayarını değiştirmen yeterlidir; gereksiz yere ekstra vertex eklemekten kaçın.",
  next:"object-mode"
},

"object-mode":{
  kicker:"01.08", subtitle:"Objeyi bir bütün olarak yönettiğin varsayılan mod.",
  nedir:["Object Mode, bir objeyi mesh detaylarına inmeden, bir bütün olarak taşıdığın, döndürdüğün ya da sildiğin moddur. Blender'ı ilk açtığında varsayılan olarak bu moddasındır."],
  visual:"modes",
  neden:["Bir sahnede birden fazla obje varken (masa, sandalye, lamba gibi), bunları birbirine göre konumlandırmak için Object Mode'da kalman gerekir. Edit Mode'a geçtiğinde sadece o an seçili olan tek objenin içine odaklanırsın."],
  kullanim:["Object Mode'dayken G/R/S ile obje bir bütün olarak hareket eder.","Birden fazla objeyi Shift + sol tık ile çoklu seçebilirsin.","X tuşu ile seçili objeyi tamamen silebilirsin."],
  next:"edit-mode"
},

"edit-mode":{
  kicker:"01.09", subtitle:"Bir objenin içine girip mesh'i şekillendirdiğin mod.",
  nedir:["Edit Mode, seçili bir objenin mesh verisine (vertex/edge/face) doğrudan erişip onu düzenlediğin moddur. Tab tuşuna basarak Object Mode ile Edit Mode arasında geçiş yaparsın."],
  visual:"modes",
  neden:["Gerçek modelleme burada gerçekleşir. Extrude, Inset, Bevel, Loop Cut gibi neredeyse tüm modelleme araçları sadece Edit Mode'da çalışır."],
  kullanim:["Tab: Object Mode ↔ Edit Mode geçişi","1/2/3: Vertex/Edge/Face seçim modu","A: tüm elemanları seç, Alt+A: seçimi kaldır"],
  mistakes:{items:["Edit Mode'da yapılan bir Move/Scale işleminin, obje seviyesindeki transform ile karıştırılması."],fix:"Edit Mode'da yaptığın hareketler mesh'in kendi verisini değiştirir; Object Mode'daki transform değerlerini etkilemez. N panelinden her ikisini de ayrı ayrı görebilirsin."},
  tip:"Bir objenin ölçeğini (Scale) Object Mode'da uyguladıktan sonra Ctrl+A → Scale ile 'kalıcı' hale getirmek, ileride Edit Mode'da yapacağın Bevel gibi işlemlerin öngörülebilir sonuç vermesini sağlar.",
  next:"move-rotate-scale"
},

"move-rotate-scale":{
  kicker:"01.10", subtitle:"Blender'ın üç temel transform aracı: G, R, S.",
  nedir:["Move (G), Rotate (R) ve Scale (S) bir objeyi ya da seçili mesh elemanlarını sırasıyla taşımak, döndürmek ve boyutlandırmak için kullanılan üç temel işlemdir. İsimleri İngilizce Grab, Rotate, Scale kelimelerinden gelir."],
  neden:["Bu üçlü, Blender'da yapacağın hemen her işlemin temelidir. Modelleme, animasyon, sahne kurulumu — hepsi bu üç harfe dayanır."],
  demo:"transform",
  kullanim:["G → taşımaya başlar, fareyi hareket ettir, sol tık ile onayla.",
    "R → döndürmeye başlar, fareyi çevir, sol tık ile onayla.",
    "S → ölçeklendirmeye başlar, fareyi objeden uzaklaştır/yaklaştır, sol tık ile onayla.",
    "Herhangi birinin ardından bir eksen tuşuna (X/Y/Z) basarak işlemi o eksene kilitleyebilir, ardından bir sayı yazarak kesin değer girebilirsin (örn. G → X → 2 → Enter)."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"G/R/S üçlüsünü bir masadaki bir bardağı elinle kaydırmak (Move), çevirmek (Rotate) ve şişirip söndürmek (Scale) gibi düşünebilirsin."},
  mistakes:{items:["Sayı girmeden sadece fare hareketiyle 'yaklaşık' değerler kullanmak.","Esc yerine sağ tık kullanmayı unutup işlemi yanlışlıkla onaylamak."],fix:"Bir transform işlemini iptal etmek için Esc ya da sağ tık kullan; bu işlemi başlamadan önceki haline geri döndürür."},
  memorize:{kv:["G = Move","R = Rotate","S = Scale"],text:"G/R/S, Blender'daki en temel transform üçlüsüdür."},
  miniTask:{rules:["Bir Cube ekle","G ile 2 birim X'e taşı","R ile 45° Z'de döndür","S ile 1.5 kat büyüt"],solution:"Shift+A → Mesh → Cube, ardından sırasıyla G→X→2→Enter, R→Z→45→Enter, S→1.5→Enter uygulaman yeterli."},
  next:"ilk-modelimiz"
},

"ilk-modelimiz":{
  kicker:"01.11", subtitle:"Öğrendiğin her şeyi birleştirerek ilk gerçek modelini üret.",
  nedir:["Bu derste tek bir Cube'dan başlayarak basit bir masa modelleyeceksin. Amaç yeni bir araç öğrenmek değil, şimdiye kadar gördüğün G/R/S, Object/Edit Mode ve eksen kısıtlama bilgisini gerçek bir üretim akışında birleştirmektir."],
  steps:[
    {id:"s1",title:"Masa yüzeyini oluştur",text:"Bir Cube ekle ve X ekseninde 3, Y ekseninde 2 birim ölçekle.",code:"Shift+A → Mesh → Cube  →  S → X → 3  →  S → Y → 2"},
    {id:"s2",title:"İnceltilmiş bir yüzeye dönüştür",text:"Z ekseninde küçülterek masa yüzeyini inceltilmiş bir plaka haline getir.",code:"S → Z → 0.15"},
    {id:"s3",title:"Ölçeği kalıcı hale getir",text:"Uyguladığın Scale değerlerini objenin kalıcı ölçeği yap, böylece sonraki adımlar öngörülebilir kalır.",code:"Ctrl+A → Scale"},
    {id:"s4",title:"Bir ayak oluştur",text:"Edit Mode'a geçip masanın bir köşe yüzeyinden aşağı doğru bir ayak çıkar.",code:"Tab → yüzeyi seç → E → Z → -2"},
    {id:"s5",title:"Diğer üç ayağı ekle",text:"Aynı işlemi diğer üç köşe için tekrarla ya da Shift+D ile kopyala ve konumlandır.",code:"Shift+D → X → ... → Enter"}
  ],
  why:"Ctrl+A → Scale adımını neden yapıyoruz? Modelin mevcut ölçeğini Blender'ın temel ölçeği olarak kabul etmesini sağlarız. Böylece Extrude ve Bevel gibi sonraki modelleme işlemlerinde beklenmedik, orantısız sonuçlarla karşılaşmayız.",
  mistakes:{items:["Scale'i Apply etmeden Edit Mode'a geçip Extrude yapmak — bu, ayakların garip oranlarda çıkmasına yol açabilir.","Ayakları Object Mode'da değil Edit Mode içinde, yanlış yüzeyden çıkarmak."],fix:"Apply Scale adımını atlama; her modelleme oturumuna bu adımla başlamak neredeyse bir refleks olmalı."},
  tip:"Karmaşık bir mobilya modellemeden önce, önce kaba bloklarla (blockout) genel oranları oturt; detaylara (bevel, malzeme) daha sonra geç.",
  next:"ilk-mini-projemiz"
},

"ilk-mini-projemiz":{
  kicker:"01.12", subtitle:"Modülü, kendi başına ürettiğin küçük bir sahne ile kapat.",
  nedir:["Bu son derste rehberlik biraz azalıyor. Önceki derste öğrendiğin masa yapım mantığını kullanarak, bu sefer kendi kararlarını vererek basit bir oda köşesi (bir masa ve bir duvar) oluşturacaksın."],
  miniTask:{rules:["En az 1 Cube kullan","Duplicate (Shift+D) kullanabilirsin","Masanın en az bir kenarına Bevel dene (Ctrl+B) — sonraki derste detaylıca göreceğiz, şimdilik denemen yeterli","Bitmiş sahnede en az 2 obje bulunsun (masa + duvar)"],
   solution:"Önce masayı önceki dersteki gibi kur. Ardından yeni bir Cube ekleyip düzleştirerek bir duvar paneli oluştur, masanın arkasına konumlandır. Son olarak masanın üst kenarlarından birine Ctrl+B ile hafif bir bevel uygulayarak kenarın nasıl yumuşadığını gözlemle."},
  why:"Bu görevi neden şimdi, Bevel'i tam öğretmeden veriyoruz? Çünkü yeni bir aracı ilk kez 'keşfederek' denemek, ne işe yaradığını daha iyi hatırlamanı sağlar. Sonraki derste Bevel'i tüm detaylarıyla, bu deneyiminin üzerine inşa ederek öğreneceksin.",
  tip:"Bu noktada mükemmel bir sonuç hedefleme; amaç öğrendiklerini kendi kararlarınla birleştirebildiğini görmek.",
  next:"primitive-objects"
},

"primitive-objects":{
  kicker:"02.01", subtitle:"Her modelin başladığı temel formlar.",
  nedir:["Primitive Objects, Blender'ın Shift+A menüsünden tek tıkla ekleyebileceğin hazır temel formlardır: Cube (küp), Sphere/Ico Sphere (küre), Cylinder (silindir), Cone (koni), Torus (simit) ve Plane (düzlem). Neredeyse her karmaşık model, bu basit formlardan biriyle başlar."],
  neden:["Karmaşık bir modeli sıfırdan, tek tek vertex ekleyerek kurmak zaman kaybıdır. Deneyimli 3D sanatçılar, hedefe en yakın primitive'i seçip onu Extrude, Bevel gibi araçlarla dönüştürerek çok daha hızlı ilerler."],
  kullanim:["Cube: kutu, mobilya, bina gibi köşeli formlar için başlangıç.","Cylinder: boru, bardak, ayak gibi yuvarlak-uzun formlar için.","Ico Sphere: organik, eşit dağılımlı küreler için (UV Sphere'e göre modelleme sonrası daha temiz topology verir).","Plane: zemin, duvar veya düz yüzeyler için."],
  tip:"Bir Cylinder eklerken kaç kenarlı (vertices) olacağını ekleme anında sol-altta çıkan panelden ayarlayabilirsin; sonradan segment sayısını değiştirmek, mesh'i baştan yapmaktan daha zordur.",
  next:"extrude"
},

"extrude":{
  kicker:"02.02", subtitle:"Modelleme araçlarının en önemli parçalarından biri.",
  nedir:["Extrude, seçili bir yüzeyi (face), kenarı (edge) ya da noktayı (vertex) mevcut geometriden dışarı doğru 'çekerek' yeni geometri oluşturan bir işlemdir. Bir face'i extrude ettiğinde, o face'in kenarları boyunca yeni yüzeyler (duvar gibi) oluşur ve seçim, çekildiği yöne taşınır."],
  visual:"extrude",
  neden:["Extrude olmadan bir küpten karmaşık bir forma geçmek neredeyse imkânsızdır. Bir kulenin gövdesini yükseltmek, bir kapının pervazını çıkarmak, bir karakterin parmağını uzatmak — bunların hepsi extrude'un farklı ölçeklerde kullanılmasıdır. Game asset üretiminde de yüzey detaylarının çoğu extrude ile başlar."],
  demo:"extrude",
  kullanim:["Bir yüzeyi (face) seç.","E tuşuna bas — varsayılan olarak yüzeyin normali (dışa bakan yönü) boyunca hareket başlar.","Fareyi hareket ettir ya da doğrudan bir eksen + sayı yaz (örn. E → Z → 1).","Sol tık ya da Enter ile onayla."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Extrude'u, bir kil bloğunun bir yüzünü parmağınla dışarı doğru çekip uzatman gibi düşün — çekilen yüzeyin çevresinde otomatik olarak yeni 'duvarlar' oluşur."},
  mistakes:{items:["E tuşuna bastıktan hemen sonra fareyi rastgele hareket ettirip yanlış eksende yeni geometri oluşturmak.","Aynı yüzeyi art arda çok kez extrude edip gereksiz, kullanılmayan geometri (iç içe yüzeyler) biriktirmek."],
    fix:"Bir extrude'u başlattıktan hemen sonra bir eksen tuşuna basarak (örn. Z) hareketi doğru yöne kilitle; yanlış gittiyse Esc ile iptal edip tekrar dene."},
  tip:"Extrude sonrası E tuşuna tekrar basmadan önce mevcut extrude'u sonlandırdığından emin ol (sol tık/Enter); aksi halde art arda katmanlar oluşabilir.",
  memorize:{kv:["E = Extrude"],text:"Extrude, seçili yüzeyi normali boyunca dışarı çekerek yeni geometri üretir."},
  miniTask:{rules:["Bir Cube ekle","Üst yüzeyini seç","E → Z → 1 uygula","Yeni oluşan yüzeyin üstüne bir kez daha küçük bir extrude dene"],
    solution:"Tab → 3 (face select) → üst yüzeye tıkla → E → Z → 1 → Enter. İkinci extrude için aynı yüzey hâlâ seçiliyken E → Z → 0.3 → Enter yeterli."},
  next:"inset"
},

"inset":{
  kicker:"02.03", subtitle:"Bir yüzeyin içine, ona paralel yeni bir yüzey ekleyerek panel detayları oluştur.",
  nedir:["Inset, seçili bir face'i, kenarlarından içe doğru küçültülmüş yeni bir face ile çevreleyerek, o yüzeyin içine ek bir kenar halkası sokan bir işlemdir. Orijinal yüzeyin dış sınırı korunur; sadece kenardan biraz içeri çekilmiş küçük bir kopyası eklenir ve aradaki ince şerit yeni bir yüzey grubu oluşturur."],
  neden:["Inset, özellikle hard-surface ve oyun asset modellemesinde panel çizgileri, buton yuvaları, kapı çerçeveleri gibi 'yüzey içinde yüzey' detaylarının temelidir. Extrude ile birlikte kullanıldığında (önce Inset, sonra aşağı doğru küçük bir Extrude) bir yüzeye gömülü buton ya da panel görünümü kolayca oluşturulur."],
  kullanim:["Bir yüzeyi seç.","I tuşuna bas, fareyi hareket ettirerek girinti miktarını ayarla, sol tık ile onayla.","I ardından doğrudan bir sayı yazarak kesin bir değer de girebilirsin (I → 0.1 → Enter).","Shift + I ile sınır kenarların her birini kendi içinde ayrı ayrı inset'leyebilirsin (Individual)."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Bir resim çerçevesinin iç kenarındaki paspartuyu düşün: dış çerçeve olduğu gibi kalır, içeride ondan biraz küçük yeni bir sınır belirir."},
  mistakes:{items:["Inset sonrası aynı yüzeyi hemen extrude etmeyi unutup, oluşan ince şeridin fark edilmeden kalması.","Çok küçük bir inset değeriyle, sonradan seçmesi zor, neredeyse görünmez bir geometri bırakmak."],
    fix:"Inset uyguladıktan hemen sonra ekranın sol altında beliren işlem panelinden (ya da F9 ile) tam sayısal değeri gözden geçir ve gerekiyorsa düzelt."},
  tip:"Inset + Extrude ikilisi, hard-surface modellemede en sık kullanacağın kombinasyonlardan biridir; bir paneli 'gömülü' göstermek için Inset sonrası E → -0.05 gibi küçük bir negatif extrude çoğu zaman yeterlidir.",
  memorize:{kv:["I = Inset"],text:"Inset, seçili yüzeyin içine, kenarlarından içeri çekilmiş yeni bir yüzey ekler."},
  miniTask:{rules:["Bir Cube ekle","Üst yüzeyini seç","I → 0.15 uygula","Oluşan iç yüzeyi E → -0.05 ile hafifçe içeri çök"],
    solution:"Tab → 3 (face select) → üst yüzeye tıkla → I → 0.15 → Enter → aynı yüzey seçiliyken E → Z → -0.05 → Enter."},
  next:"loop-cut"
},

"loop-cut":{
  kicker:"02.04", subtitle:"Mesh üzerine, modelin etrafını tam saran ek bir kesim halkası ekle.",
  nedir:["Loop Cut, mevcut geometrinin etrafını (bir küpte olduğu gibi) uçtan uca saran yeni bir edge dizisi ekleyen araçtır. Bu, o bölgede yeni kontrol noktaları oluşturarak, ileride o kısmı ayrı şekillendirebilmeni sağlar."],
  neden:["Loop Cut hem daha organik bir yüzey elde etmek (Subdivision Surface ile birlikte) hem de belirli bir bölgeyi keskin tutmak (bevel'den önce 'destek halkası' olarak) için kritik bir araçtır. Mesh'in topology'sini kontrollü şekilde büyütmenin en temel yoludur."],
  kullanim:["Ctrl+R tuşuna bas, fareyi kesilecek yön üzerinde gezdir — sarı bir önizleme çizgisi belirir.","Sol tık ile kesimin sayısını/yönünü onayla.","Ardından fareyi hareket ettirerek konumu kaydır, ya da hemen sağ tık/Esc ile tam ortada bırak.","Onaylamadan önce fare tekerleğiyle kaç paralel loop ekleneceğini artırabilirsin."],
  mistakes:{items:["İlk sol tıktan hemen sonra hâlâ konumlandırma modunda olduğunu unutup yanlışlıkla loop'u kaydırmak.","Yanlış eksende, istemediğin bir yönde kesim oluşturmak."],
    fix:"İlk sol tık sadece kesim sayısını sabitler; hâlâ konumlandırma aşamasındasındır. Loop'u tam ortada bırakmak istiyorsan hemen ardından sağ tık ya da Esc'e bas."},
  tip:"Bir kenarı bevel'lemeden önce, o kenarın hemen iki yanına ince birer loop cut eklemek ('support loop'), sonraki subdivision işleminde yüzeyin beklenmedik şekilde şişmesini engeller.",
  memorize:{kv:["Ctrl+R = Loop Cut"],text:"Loop Cut, geometrinin etrafını tam bir halka olarak saran yeni bir kesim ekler."},
  next:"bevel"
},

"bevel":{
  kicker:"02.05", subtitle:"Modelin keskin kenarlarını kontrollü şekilde yumuşat.",
  nedir:["Bevel, seçili bir kenarı (edge) ya da köşeyi (vertex), tek bir keskin çizgi yerine birden fazla küçük yüzeyle değiştirerek yumuşatan bir işlemdir. Sonuç, tamamen düz bir köşe yerine hafifçe kırılmış, ışığı daha yumuşak yansıtan bir kenardır."],
  visual:"extrude",
  neden:["Gerçek dünyadaki hiçbir obje matematiksel olarak sonsuz keskinliğe sahip bir kenara sahip değildir — metal bir kutunun, bir telefonun ya da bir masanın kenarına yakından baksan, hepsinde küçük bir yuvarlama görürsün. Bu küçük detay, ışığın kenar üzerinde ince bir highlight (parlama çizgisi) oluşturmasını sağlar; bu highlight olmadan render'lar 'dijital' ve yapay görünür.",
    "Game asset üretiminde bevel ayrıca çok kritik bir teknik rol oynar: keskin bir kenarın normali ışığa göre ani şekilde değiştiği için gölgelemede çirkin, sert bir çizgi oluşur; birkaç dereceyi geçmeyen küçük bir bevel bu geçişi yumuşatarak modelin low-poly bile olsa daha 'yüksek kaliteli' görünmesini sağlar."],
  demo:"bevel",
  kullanim:["Ctrl+B → seçili kenar(ler)i bevel etmeye başlar.","Fareyi hareket ettirerek miktarı (Amount) ayarla.","Fare tekerleği ile segment sayısını (Segments) artırıp azaltabilirsin — daha fazla segment, daha yuvarlak bir kenar verir.","Sol tık ile onayla.","Bevel Modifier ile aynı işlemi tüm modele, non-destructive (kalıcı olmayan) şekilde uygulayabilirsin."],
  kisayolAyrinti:[
    {label:"Amount",text:"Kenarın ne kadar içeri doğru yumuşatılacağını belirler; çok yüksek değerler komşu geometriyle çakışabilir."},
    {label:"Segments",text:"Yuvarlatılan kenarın kaç yüzeyden oluşacağını belirler. 1 segment sert bir kesim, 4+ segment yumuşak bir yuvarlama verir."},
    {label:"Limit Method",text:"Bevel'in modeldeki hangi kenarlara otomatik uygulanacağını belirler (örn. sadece belirli bir açıdan keskin olan kenarlara)."}
  ],
  compare:true,
  mistakes:{items:["Scale değeri Apply edilmemiş bir objede bevel uygulayınca kenarların orantısız yuvarlanması.",
    "Yanlış geometri seçilip (örneğin tüm mesh yerine tek bir vertex) beklenmeyen bir sonuç almak.",
    "Normallerin ters yöne baktığı (ters çevrilmiş) bir mesh'te bevel'in garip gölgelenmesi."],
   fix:"Önce Ctrl+A → Scale ile ölçeği sıfırla, ardından bevel'i geometrinin doğru bölümünü (genelde tüm dış kenarları) seçerek uygula. Gölgeleme garip görünüyorsa Mesh → Normals → Recalculate Outside ile normalleri düzelt."},
  tip:"Modelleme sırasında gereksiz yere çok fazla subdivision kullanmak yerine doğru topology ve küçük, kontrollü bevel'lerle kenarlarını yönet — bu hem daha temiz hem daha performanslı bir model verir.",
  memorize:{kv:["Ctrl+B = Bevel","Amount + Segments"],text:"Bevel, keskin bir kenarı kontrollü sayıda yeni yüzeyle yumuşatan işlemdir."},
  miniTask:{rules:["Önceki derste yaptığın masayı aç (ya da yeni bir Cube ile masa formunu tekrar oluştur)","Masanın tüm dış kenarlarına kontrollü bir bevel uygula (Amount düşük, Segments 2-3)","Sonucu Object Mode'da 'Shade Smooth' ile karşılaştır"],
   solution:"Tüm kenarları seçmek için Edit Mode'da A tuşuna bas, ardından Ctrl+B → fareyi hafifçe hareket ettir → tekerlek ile segment sayısını 2-3 yap → sol tık ile onayla."},
  next:"knife"
},

"knife":{
  kicker:"02.06", subtitle:"Mesh üzerine serbest elle, istediğin yerden yeni kesimler çiz.",
  nedir:["Knife (Bıçak) aracı, Loop Cut'ın aksine mesh üzerinde tam bir halka değil, senin tıkladığın noktalar arasında tamamen serbest yeni edge'ler oluşturan bir araçtır. Bir yüzeyin herhangi bir noktasından başlayıp herhangi bir noktasına kadar kesim yapabilirsin."],
  neden:["Loop Cut düzenli ve simetrik kesimler için idealken, Knife düzensiz, tek seferlik ya da çok spesifik bir konumda yeni geometri gerektiğinde devreye girer — örneğin bir yüzeyin tam ortasına tek bir çentik eklemek istediğinde."],
  kullanim:["K tuşuna bas.","Mesh üzerinde sırayla tıklayarak kesim noktalarını belirle.","Enter ile onayla — Blender, onaylamadan Knife modundan çıkmaz.","C tuşu, kesimi yüzey merkezlerinden geçecek şekilde kilitler (angle constrain); Ctrl ise mevcut edge'lerin orta noktalarına yapışmanı sağlar."],
  mistakes:{items:["Kesimi Enter ile onaylamayı unutup başka bir işleme geçmeye çalışmak — Blender hâlâ Knife modunda kalır.","Çok fazla, gereksiz serbest kesim ekleyip mesh'i düzensiz (n-gon dolu) hale getirmek."],
    fix:"Kesim bittiğinde mutlaka Enter'a bas; işi bitirmeden Esc'e basarsan o ana kadarki tüm kesim iptal olur."},
  tip:"Knife ile eklediğin kesimlerin mümkün olduğunca quad (4 kenarlı) yüzeyler bırakmasına özen göster; sonraki bevel ve subdivision işlemleri quad topology üzerinde çok daha öngörülebilir sonuç verir.",
  memorize:{kv:["K = Knife"],text:"Knife, mesh üzerinde serbest elle yeni kesim çizgileri oluşturur."},
  next:"merge"
},

"merge":{
  kicker:"02.07", subtitle:"Birden fazla noktayı tek bir noktada birleştir.",
  nedir:["Merge, seçtiğin iki ya da daha fazla vertex'i tek bir vertex'e indirger. Bu noktalar birbirine çok yakınsa ya da aynı konumdaysa, Merge onları hem görsel olarak hem de veri düzeyinde tek bir noktaya birleştirir."],
  neden:["Modelleme sırasında — özellikle Knife kullanırken, parçaları Duplicate ile çoğaltıp birleştirirken ya da ayrı eklenen parçaları bir araya getirirken — birbirine çok yakın ama teknik olarak ayrı duran vertex'ler oluşabilir. Bunlara 'duplicate vertex' denir ve gölgelemede ince çizgi ya da yırtık görünümü gibi hatalara yol açabilir. Merge bu sorunu çözer."],
  kullanim:["Birleştirmek istediğin vertex'leri seç.","M tuşuna bas.","Açılan menüden bir seçenek belirle: 'At Center' (seçilenlerin tam ortasına), 'At Last' (en son tıkladığın noktaya) ya da 'By Distance' (belirli bir mesafeden yakın tüm vertex'leri otomatik birleştirir)."],
  mistakes:{items:["'By Distance' mesafesini çok büyük tutup, aslında ayrı kalması gereken vertex'leri de yanlışlıkla birleştirmek.","Merge sonrası oluşan n-gon (5 ve üzeri kenarlı) yüzeyleri fark etmemek."],
    fix:"'By Distance' kullandığında Blender ekranın altında kaç vertex'in birleştirildiğini bildirir; bu sayı beklediğinden fazlaysa Ctrl+Z ile geri al ve mesafeyi küçült."},
  tip:"Bir mesh'i dışa aktarmadan (export) önce Merge by Distance çalıştırmak, gözle görünmeyen duplicate vertex'lerden kaynaklanan garip gölgelenme hatalarını büyük ölçüde önler.",
  memorize:{kv:["M = Merge"],text:"Merge, seçili vertex'leri tek bir noktada birleştirir."},
  next:"separate"
},

"separate":{
  kicker:"02.08", subtitle:"Tek bir mesh'i birden fazla bağımsız objeye ayır.",
  nedir:["Separate, bir objenin mesh verisinin bir kısmını — seçtiğin vertex/edge/face grubunu — alıp, aynı şekle sahip ama artık tamamen bağımsız, kendi transform değerlerine sahip yeni bir obje olarak ayırır."],
  neden:["Bazı parçaların — örneğin bir kapının kolu ya da bir masanın tek tek ayakları — sahne içinde bağımsız olarak taşınabilmesi, farklı bir malzeme alabilmesi ya da bir oyun motorunda ayrı bir collision/prefab olarak davranması gerekir. Separate tam olarak bunu mümkün kılar."],
  kullanim:["Edit Mode'da ayırmak istediğin geometriyi seç.","P tuşuna bas.","Açılan menüden 'Selection' seçeneğini seç.","Seçtiğin kısım artık Outliner'da yeni, bağımsız bir obje olarak görünür."],
  mistakes:{items:["Separate etmeden önce yanlış elemanları (örneğin istenmeyen ekstra bir yüzeyi de) seçmiş olmak.","Separate sonrası yeni objenin pivot noktasının (origin) beklenmedik bir yerde, örneğin sahnenin merkezinde kalması."],
    fix:"Separate sonrası yeni objeyi seçip Object → Set Origin → Origin to Geometry uygula; bu, pivot'un objenin kendi merkezine oturmasını sağlar."},
  tip:"Bir modeli Unity ya da Unreal Engine gibi bir oyun motoruna aktaracaksan, hareket edecek ya da ayrı davranacak her parçayı (kapı kanadı, çekmece, tekerlek gibi) Blender içinde Separate ile ayrı bir obje haline getir. Bu sayede motor tarafında her biri kendi Transform/Rigidbody bileşenine sahip, bağımsız bir GameObject (Unity) ya da Actor (Unreal Engine) olarak içeri aktarılır — sahnede o parçayı ayrı ayrı döndürüp oynatabilirsin.",
  memorize:{kv:["P = Separate"],text:"Separate, seçili geometriyi bağımsız yeni bir objeye ayırır."},
  next:"normals"
},

"normals":{
  kicker:"02.09", subtitle:"Bir yüzeyin 'dışının' hangi yönde olduğunu tanımlayan görünmez ok.",
  nedir:["Her face'in bir normali vardır — o yüzeyin dışa bakan yönünü gösteren, mesh verisinde saklı, görünmez bir vektördür. Render motoru (Eevee, Cycles) ve oyun motorları (Unity, Unreal Engine) bir yüzeyi nereden görünür, nereden görünmez sayacağını bu normale göre belirler."],
  visual:"face",
  neden:["Ters dönmüş (yanlış yöne bakan) bir normal, o yüzeyin render'da ya da oyun motorunda tamamen görünmez olmasına ya da yanlış gölgelenmesine yol açar. Bu, yeni başlayanların en sık karşılaştığı, en kafa karıştırıcı hatalardan biridir — model 'doğru' görünse bile bir yüzeyi eksik veya simsiyah gösterebilir."],
  kullanim:["Normalleri görselleştirmek için Viewport Overlays menüsünden Normals (Face/Vertex) seçeneğini aç.","Ters dönmüş normalleri toplu düzeltmek için Edit Mode'da tümünü seç (A), ardından Mesh → Normals → Recalculate Outside (kısayol Shift+N)."],
  mistakes:{items:["Boolean ya da Mirror gibi işlemler sonrası bazı yüzeylerin ters dönmesi ve bunun fark edilmemesi.","Kapalı olmayan (delikli, 'non-manifold') bir mesh'te Recalculate Outside'ın yanlış sonuç vermesi."],
    fix:"Recalculate Outside yalnızca kapalı bir mesh'te güvenilir çalışır. Sorunlu tek bir yüzey varsa onu manuel seçip Mesh → Normals → Flip ile tek başına ters çevirebilirsin."},
  tip:"Unity ve Unreal Engine, normal ve yumuşatma (smoothing) bilgisini FBX içinde farklı yorumlayabilir: Blender'da uyguladığın 'Shade Auto Smooth' açısı, Unity'nin FBX içe aktarma ayarlarındaki 'Normals: Calculate' ve 'Smoothing Angle' değeriyle eşleşmelidir — aksi halde motora aktarılan model, Blender'da gördüğünden daha sert ya da daha yumuşak gölgelenmiş görünebilir. Unreal Engine'de aynı ayar, Static Mesh içe aktarma penceresindeki 'Normal Import Method' seçeneğiyle kontrol edilir.",
  memorize:{kv:["Shift+N = Recalculate Outside"],text:"Normal, bir yüzeyin dışa bakan yönünü tanımlar; ters dönmüş normaller hem render'da hem oyun motorunda görünürlük ve gölgeleme hatasına yol açar."},
  next:"topology"
},

"topology":{
  kicker:"02.10", subtitle:"Bir mesh'teki vertex/edge/face düzeninin genel yapısı.",
  nedir:["Topology, bir mesh'i oluşturan vertex, edge ve face'lerin nasıl dağıldığını, nasıl 'aktığını' tanımlayan genel terimdir. İyi topology, çoğunlukla dört kenarlı (quad) yüzeylerden oluşan, akışı modelin formunu takip eden, gereksiz yoğunlaşmalar (n-gon, pole) içermeyen bir düzendir."],
  neden:["Kötü topology; deformasyonlarda (animasyon, subdivision) beklenmedik bozulmalara, bevel ve subdivision'da garip sonuçlara ve oyun motorlarında gereksiz yere yüksek poligon sayısına yol açar. İyi topology mantığını öğrenmek, ileri seviye modellemenin neredeyse tamamının temelidir."],
  kullanim:["Quad (4 kenar): en öngörülebilir, en çok tercih edilen yüzey tipi.","Triangle (3 kenar): genelde dışa aktarım sırasında motor tarafından zaten otomatik üretilir; elle çok fazla kullanmaktan kaçınılır.","Ngon (5+ kenar): mümkün olduğunca az kullanılmalı — subdivision ve bevel'de öngörülemeyen sonuçlar verir.","Pole: 3 ya da 5+ edge'in birleştiği vertex; deformasyonlarda sorun kaynağı olabilir, özellikle karakter modellemede dikkatle yönetilir."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Topology'yi bir kumaşın dokuma yönü gibi düşünebilirsin — kumaş doğru yönde dokunursa vücuda güzel oturur, yanlış yönde dokunursa buruşur ve garip gerilir."},
  mistakes:{items:["Detay eklemek için mesh'e rastgele ekstra vertex/edge eklemek ve düzenli akışı bozmak.","Çok fazla n-gon biriktirip sonradan bevel ya da subdivision uygulayınca yüzeyde beklenmedik çöküntüler görmek."],
    fix:"Yeni geometri eklerken elinden geldiğince Loop Cut kullanarak akışı koru; zorunlu n-gon'lar oluşuyorsa bunları düzenli aralıklarla Knife veya Merge ile quad'a çevir."},
  tip:"Gerçek zamanlı oyun motorları (Unity, Unreal Engine) için modelleme yaparken, 'iyi topology' kadar 'poligon bütçesi' de önemlidir: mobil bir Unity projesinde bir karakter genelde birkaç bin üçgeni geçmemeli, bir PC/konsol projesinde bu sayı çok daha yüksek olabilir. Blender'da N panelinden Viewport Overlays → Statistics açarak anlık üçgen sayını takip edebilir, hedeflediğin motorun bütçesine göre modelini optimize edebilirsin.",
  memorize:{kv:["Quad > Triangle > N-gon"],text:"İyi topology, mümkün olduğunca quad'lardan oluşan, modelin formunu takip eden düzenli bir akıştır."},
  miniTask:{rules:["Modülün başından beri yaptığın masa/oda modelini aç","Statistics overlay'ini aç ve toplam üçgen (Tris) sayısını not et","Varsa gördüğün n-gon'ları Knife ile quad'a böl"],
    solution:"N panelinden Viewport Overlays altında Statistics kutucuğunu işaretle; sol üst köşede beliren 'Tris' değeri toplam üçgen sayındır. N-gon'ları otomatik bulmak için Select → Select All by Trait → Faces by Sides → Type: Greater Than, Number of Vertices: 4 seçebilirsin."},
  next:"hs-bevel"
},

"hs-bevel":{
  kicker:"03.01", subtitle:"Temel Bevel'i hard-surface modellemede, Weighted Normal ile birlikte kalıcı olmayan bir katman olarak kullan.",
  nedir:["Temel Modelleme modülünde Bevel'in Edit Mode'daki (Ctrl+B) halini gördün. Hard-surface modellemede aynı işlemi çoğunlukla bir Bevel Modifier olarak, yani mesh'i kalıcı olarak değiştirmeden, tüm modele otomatik uygulanan bir katman şeklinde kullanırsın."],
  neden:["Bevel Modifier, modelin üzerinde çalışmaya devam ederken — yeni yüzeyler eklerken, oranları değiştirirken — kenarların otomatik güncellenmesini sağlar. Edit Mode'daki manuel bevel'i her değişiklikte elden geçirmek zorunda kalmazsın."],
  kullanim:["Properties panelinden Modifier (anahtar ikonu) sekmesine gir.","Add Modifier → Generate → Bevel seç.","Amount ve Segments, Edit Mode'daki Bevel ile aynı mantıkla çalışır.","Limit Method → Angle, sadece belirlediğin açıdan daha keskin kenarlara otomatik uygulama yapmanı sağlar — elle her kenarı seçmene gerek kalmaz."],
  kisayolAyrinti:[
    {label:"Limit Method: Angle",text:"Sadece belirlediğin açıdan (örn. 30°) daha keskin kenarlara otomatik bevel uygular."},
    {label:"Clamp Overlap",text:"Çok yakın kenarlarda bevel'in kendi üzerine binmesini engeller."},
    {label:"Harden Normals",text:"Bevel sonrası gölgelemeyi, ekstra geometri eklemeden düzeltir — hard-surface'te sık kullanılır."}
  ],
  mistakes:{items:["Bevel Modifier'ı ekleyip Apply etmeden mesh'i dışa aktarmaya çalışmak — bazı formatlar modifier'ları desteklemez.","Limit Method: Angle kullanırken çok düşük bir açı seçip modelin her köşesinin gereksiz yere yuvarlanması."],
    fix:"Export öncesi Modifier panelinden 'Apply' butonuna basarak modifier'ı kalıcı hale getir; Angle değerini 25-35° arası genelde iyi bir başlangıç noktasıdır."},
  tip:"Harden Normals seçeneği açıkken Auto Smooth'un da açık olması gerekir; ikisi birlikte, ekstra geometri eklemeden neredeyse subdivision kalitesinde bir highlight verir.",
  memorize:{kv:["Modifier > Generate > Bevel"],text:"Bevel Modifier, kenar yuvarlamasını modele kalıcı olmayan, güncellenebilir bir katman olarak uygular."},
  next:"hs-boolean"
},

"hs-boolean":{
  kicker:"03.02", subtitle:"İki mesh'i birleştir, çıkar ya da kesiştir — hard-surface modellemenin en güçlü aracı.",
  nedir:["Boolean Modifier, iki objeyi matematiksel küme işlemleriyle birleştirir: Union (birleştir — iki şekli tek bir hacimde toplar), Difference (çıkar — bir şeklin diğerinden kapladığı hacmi oyar) ve Intersect (kesiştir — sadece iki şeklin ortak hacmini bırakır)."],
  neden:["Elle extrude/inset ile saatler sürecek bir delik açma, girinti oyma ya da iki karmaşık formu birleştirme işlemini Boolean saniyeler içinde yapar. Sci-fi kasa, endüstriyel kapı gibi çok parçalı hard-surface modellerin neredeyse tamamı Boolean'a dayanır."],
  demo:"boolean",
  kullanim:["Delik açmak istediğin objeyi seç.","Modifier → Add Modifier → Generate → Boolean → Operation: Difference.","Object alanına deliği oyacak şekli (örn. bir silindir) seç.","O şekli (kesici objeyi) gizle ya da ayrı bir koleksiyona taşı, son olarak Apply et."],
  mistakes:{items:["Boolean sonrası kesişim bölgelerinde n-gon ve düzensiz topology oluşması ve bunun fark edilmemesi.","İki mesh'in yüzeyleri tam üst üste (coplanar) geldiğinde Boolean'ın kararsız, delikli sonuçlar vermesi."],
    fix:"Boolean sonrası oluşan kesişim kenarlarını temizlemek için genelde bir miktar elle Merge/Knife gerekir; coplanar sorununu önlemek için kesen objeyi orijinal yüzeyden hafifçe taşırarak (offset) konumlandır."},
  tip:"Boolean işlemlerini geri döndürülebilir tutmak için, kesen objeyi silmek yerine sadece görünmez (viewport'ta kapalı göz ikonu) yap; ileride ölçüyü değiştirmen gerekirse Apply etmeden önce tekrar düzenleyebilirsin.",
  memorize:{kv:["Union = birleştir","Difference = çıkar","Intersect = kesiştir"],text:"Boolean, iki mesh arasında küme işlemi uygulayan bir modifier'dır."},
  miniTask:{rules:["Bir Cube ekle","İçine bir Cylinder ekle, kabaca ortasına yerleştir","Cube'a Boolean Modifier ekle, Operation: Difference, Object: Cylinder","Apply et ve Cylinder'ı sil"],
    solution:"Cube seçiliyken Modifier → Add Modifier → Generate → Boolean → Operation: Difference → Object: Cylinder → Apply → Cylinder objesini X ile sil; Cube'un ortasında silindirik bir delik kalmalı."},
  next:"hs-mirror"
},

"hs-mirror":{
  kicker:"03.03", subtitle:"Bir tarafı modelle, diğer tarafı otomatik ve simetrik olarak oluşsun.",
  nedir:["Mirror Modifier, mesh'inin bir eksen etrafında (genelde X) otomatik bir aynasını oluşturur. Orijinal tarafta yaptığın her değişiklik, karşı tarafa anında yansır."],
  neden:["Karakterler, araçlar, mobilyalar gibi simetrik objelerin çoğu sadece yarısı modellenip Mirror ile tamamlanır — hem zamandan büyük tasarruf sağlar hem de iki tarafın birebir simetrik kalmasını garanti eder."],
  demo:"mirror",
  kullanim:["Modelinin merkezini dünya orijinine (0,0,0) hizala.","Modifier → Add Modifier → Generate → Mirror → Axis: X (ya da modelinin simetri eksenine göre Y/Z).","'Clipping' seçeneğini aç — bu, ortadaki vertex'lerin yanlışlıkla ayrılıp aradan boşluk açılmasını engeller."],
  mistakes:{items:["Modelin merkezini orijine hizalamadan Mirror eklemek — ayna, obje orijinine göre çalıştığı için simetri tamamen yanlış yerde oluşur.","Clipping kapalıyken orta hattaki vertex'leri taşıyıp iki yarı arasında görünür bir boşluk/çakışma bırakmak."],
    fix:"Mirror eklemeden önce objeyi seçip Object → Set Origin ile merkezini doğru noktaya taşı, ya da Edit Mode'da geometriyi merkeze hizala; Clipping'i her zaman açık tut."},
  tip:"Mirror Modifier'ı Edit Mode'dayken de açık bırakmak, karşı tarafı canlı önizlemede görerek modellemeyi çok kolaylaştırır — 'Apply' etmeyi en sona, model tamamen bitene kadar erteleyebilirsin.",
  memorize:{kv:["Axis: X / Y / Z","Clipping = orta hat boşluğunu önler"],text:"Mirror, modelin bir yarısını otomatik olarak diğer tarafa yansıtır."},
  next:"hs-array"
},

"hs-array":{
  kicker:"03.04", subtitle:"Bir objeyi belirli bir aralıkla otomatik olarak çoğalt.",
  nedir:["Array Modifier, seçili objeyi belirlediğin bir mesafe/yön boyunca otomatik olarak tekrar tekrar çoğaltır — bir çit, merdiven basamakları, cıvata dizisi gibi tekrarlayan desenler için idealdir."],
  neden:["Aynı parçayı elle Shift+D ile onlarca kez kopyalamak yerine, Array tek bir ayardan sayıyı ve mesafeyi kontrol etmeni sağlar; orijinal parçada yaptığın bir değişiklik tüm kopyalara anında yansır."],
  demo:"array",
  kullanim:["Modifier → Add Modifier → Generate → Array.","Count ile kaç kopya istediğini belirle.","Relative Offset (obje boyutuna göre, örn. X: 1.0 bir sonraki kopyayı tam objenin genişliği kadar öteler) ya da Constant Offset (sabit birim mesafe) ile aralığı ayarla."],
  mistakes:{items:["Relative Offset ile Constant Offset'i karıştırıp beklenmeyen aralıklarla kopyalar elde etmek.","Array sonucu oluşan kopyaların birbirine çok yakın/çakışık gelip gereksiz iç yüzeyler bırakması."],
    fix:"Basit, düzenli aralıklar için Relative Offset; belirli sabit bir mesafe (örn. tam 2 metre) için Constant Offset kullan. Kopyalar çakışıyorsa offset değerini objenin gerçek boyutuna göre yeniden hesapla."},
  tip:"Array'i bir Curve objesiyle birleştirmek (Fit Curve seçeneği), düz bir çizgi yerine eğri bir yol boyunca — örn. bir merdiven korkuluğu, kıvrımlı bir boru — otomatik dizilim oluşturmanı sağlar.",
  memorize:{kv:["Count","Relative / Constant Offset"],text:"Array, bir objeyi belirlediğin aralık ve sayıda otomatik olarak çoğaltan bir modifier'dır."},
  miniTask:{rules:["Küçük bir Cube ('tuğla') oluştur","Array Modifier ekle, Count: 6","Relative Offset X: 1.1 yap (tuğlalar arasında ince boşluk için)"],
    solution:"Cube'u küçült → Modifier → Array → Count: 6 → Relative Offset X: 1.1 → sonuçta yan yana, aralarında ince boşluk olan 6 kopya oluşmalı."},
  next:"hs-edge-control"
},

"hs-edge-control":{
  kicker:"03.05", subtitle:"Bevel ve Subdivision'ın modelin neresinde etkili olacağını hassas şekilde yönet.",
  nedir:["Edge Control tek bir araç değil; bir modelin hangi kenarlarının keskin kalacağını, hangilerinin yumuşayacağını kontrol etmek için Bevel Weight, Crease ve seçici Bevel Modifier ayarlarının bir arada kullanılmasıdır."],
  neden:["Bir Subdivision Surface modifier'ı tüm modeli otomatik yumuşatır — ama hard-surface modellerde bazı kenarların (bir panelin dış hattı gibi) keskin kalması gerekir. Edge Control olmadan Subdivision, modelin tüm karakterini eritip amorf bir forma dönüştürür."],
  kullanim:["Bir kenarı seç, Edge → Edge Crease (kısayol Shift+E) ile o kenarı Subdivision'a karşı 'dirençli' yap — değer 1.0'a yaklaştıkça kenar daha keskin kalır.","Alternatif olarak Bevel Modifier'ın Limit Method: Weight seçeneğiyle, sadece Bevel Weight verdiğin (Ctrl+Shift+E) kenarlara bevel uygulayabilirsin."],
  kisayolAyrinti:[
    {label:"Shift+E",text:"Edge Crease — Subdivision Surface'a karşı kenarı sertleştirir."},
    {label:"Ctrl+Shift+E",text:"Bevel Weight — sadece Bevel Modifier'ın Weight moduna işaret eden bir değer atar."}
  ],
  mistakes:{items:["Crease değerini 1.0'a çok yakın verip, o bölgede Subdivision'ın neredeyse hiç etkisi kalmamasına, keskin bir çentik oluşmasına neden olmak.","Edge Control ayarlarını Subdivision Modifier eklemeden önce test edip, sonuçsuz kaldığını sanmak — bu ayarlar sadece Subdivision aktifken görünür etki yapar."],
    fix:"Crease değerini 0.7-0.9 aralığında tutmak genelde daha doğal bir geçiş verir; ayarların etkisini görmek için önce bir Subdivision Surface modifier'ı ekleyip Edit Mode'da canlı önizlemeyi aç."},
  tip:"Support Loops ile Edge Crease birbirinin alternatifidir: Support Loops gerçek geometri ekleyerek kenarı sertleştirirken, Crease hiç ekstra geometri eklemeden benzer bir sonucu simüle eder — performans öncelikliyse Crease, maksimum kontrol öncelikliyse Support Loops tercih edilir.",
  memorize:{kv:["Shift+E = Crease","Ctrl+Shift+E = Bevel Weight"],text:"Edge Control, hangi kenarların keskin kalacağını Subdivision ve Bevel'e karşı yönetmektir."},
  next:"hs-support-loops"
},

"hs-support-loops":{
  kicker:"03.06", subtitle:"Bir kenarı gerçek geometriyle destekleyerek Subdivision sonrası şeklin bozulmasını önle.",
  nedir:["Support Loop, keskin kalması istenen bir kenarın hemen iki yanına eklenen, o kenara yakın konumlandırılmış ek loop cut'lardır. Bu ekstra geometri, Subdivision Surface uygulandığında kenarın etrafındaki yüzeyin çok fazla 'şişmesini' engeller."],
  neden:["Support Loop kullanmadan Subdivision uygulanan bir hard-surface model, tüm keskin hatlarını kaybedip yumuşak, 'sabunlu' bir görünüm alır. Support Loop'lar, hangi bölgelerin sert hangi bölgelerin yumuşak kalacağını geometri düzeyinde garanti eder."],
  kullanim:["Ctrl+R ile keskin kalmasını istediğin kenarın hemen iki tarafına, o kenara ne kadar yakın olursa o kadar keskin bir sonuç verecek şekilde iki ince loop cut ekle.","Kenara çok yakın loop'lar (%5-10 mesafe) neredeyse sert bir köşe, daha uzak loop'lar (%20-30) daha yumuşak bir geçiş verir."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Support Loop'ları bir çadır bezinin köşesine dikilen ekstra bir dikiş şeridi gibi düşün — bez geri kalanında serbestçe dalgalanırken, o şerit köşenin şeklini korur."},
  mistakes:{items:["Support Loop'ları kenara çok uzak koyup, beklenen keskinliği elde edememek.","Her kenara gereksiz yere support loop eklemek ve mesh'in vertex sayısını gereksiz şişirmek — Edge Crease çoğu zaman aynı işi daha az geometriyle yapar."],
    fix:"Loop'ları kenara ne kadar yaklaştırırsan sonuç o kadar keskinleşir; sonucu görmek için her zaman Subdivision Surface'ı açık tutarak çalış. Performans kritikse önce Crease'i dene, yalnızca yetersiz kaldığında Support Loop'a geç."},
  tip:"Support Loop eklerken Loop Cut'ın fare tekerleğiyle aynı anda iki paralel loop eklemesini kullanmak (kesim öncesi tekerleği bir kez çevir), tek işlemde her iki destek loop'unu birden oluşturur.",
  memorize:{kv:["Loop kenara yakın = keskin","Loop kenardan uzak = yumuşak"],text:"Support Loop, bir kenarı gerçek ek geometriyle Subdivision'a karşı koruyan klasik hard-surface tekniğidir."},
  next:"hs-weighted-normal"
},

"hs-weighted-normal":{
  kicker:"03.07", subtitle:"Düşük poligonlu bir modelin, yüksek poligonlu gibi gölgelenmesini sağla.",
  nedir:["Weighted Normal Modifier, bir modelin normal verisini komşu yüzeylerin alanına ve açısına göre yeniden hesaplayarak, özellikle bevel'lenmiş keskin köşelerde çok daha temiz, tutarlı bir gölgelenme üretir."],
  neden:["Sadece Shade Auto Smooth kullanmak, bazı hard-surface modellerde — özellikle ince bevel'li keskin köşelerde — gölgelemede çirkin, yamalı lekelere yol açabilir. Weighted Normal bu sorunu, ekstra geometri eklemeden, sadece normal verisini akıllıca yeniden dağıtarak çözer."],
  kullanim:["Modifier → Add Modifier → Generate → Weighted Normal ekle.","Shade Auto Smooth'un da açık olduğundan emin ol — ikisi birlikte çalışır.","Weight değeri genelde varsayılanında (50) bırakılabilir; sorunlu bölgeler için ince ayar yapılabilir."],
  mistakes:{items:["Weighted Normal ekleyip Auto Smooth'u açmayı unutmak — modifier tek başına görünür bir fark yaratmaz.","Weighted Normal'ı modifier sırasında Bevel'den önce eklemek — normal düzeltmesi, geometri son haline geldikten sonra, yani listenin en altında olmalı."],
    fix:"Modifier sırasını kontrol et: Bevel/Boolean gibi geometri değiştiren modifier'lar üstte, Weighted Normal en altta olmalı; Object Data Properties'ten (yeşil üçgen ikon) Shade Auto Smooth'u aç."},
  tip:"Weighted Normal ile Bevel Modifier'daki 'Harden Normals' seçeneğini aynı anda kullanma; ikisi bazen çakışan sonuçlar verebilir — genelde Weighted Normal tek başına daha tutarlı çalışır.",
  memorize:{kv:["Weighted Normal + Auto Smooth birlikte çalışır"],text:"Weighted Normal, düşük poligonlu bir modelin gölgelemesini, ekstra geometri eklemeden iyileştiren bir modifier'dır."},
  miniTask:{rules:["Önceki derslerde Bevel Modifier eklediğin bir modeli aç","Modifier listesinin en altına Weighted Normal ekle","Object Data Properties'ten Shade Auto Smooth'u aç","Köşelerdeki gölgelenme farkını gözlemle"],
    solution:"Modifier panelinde Weighted Normal'ı listenin en altına sürükle → yeşil üçgen (Object Data) sekmesinden Shade Auto Smooth'u aç → modifier'ı gizleyip açarak köşelerdeki gölgelenmenin öncesi/sonrasını karşılaştır."},
  next:"mod-mantik"
},

"mod-mantik":{
  kicker:"04.01", subtitle:"Modelini kalıcı olarak değiştirmeden şekillendiren katman sistemi.",
  nedir:["Bir Modifier, mesh'inin ham verisini (vertex/edge/face) doğrudan değiştirmeden, üzerine eklenen ve viewport'ta anlık olarak hesaplanan bir işlem katmanıdır. Bevel, Mirror, Array, Boolean gibi Hard Surface modülünde gördüğün her araç aslında bir modifier'dı — bu ders onların ortak mantığını bir araya topluyor."],
  neden:["Modifier'lar olmadan her değişiklik kalıcı ve geri dönüşü zor olurdu: bir Mirror'ı elle yapıp sonra oranı değiştirmen gerekseydi, tüm simetriyi elle yeniden kurman gerekirdi. Modifier stack, 'non-destructive' (yıkıcı olmayan) bir iş akışının temelidir — istediğin an geri dönüp bir ayarı değiştirebilirsin."],
  kullanim:["Properties panelinde anahtar (wrench) ikonuna tıkla → Add Modifier.","Kategoriye göre seç: Generate (Bevel/Mirror/Array/Boolean/Solidify/Subdivision gibi geometri üreten modifier'lar), Deform (Simple Deform gibi şekil bükenler), Physics (simülasyon tabanlılar).","Her modifier'ın üstündeki göz ikonlarıyla viewport'ta ve render'da görünürlüğünü ayrı ayrı kontrol edebilirsin."],
  kisayolAyrinti:[
    {label:"Viewport gözü",text:"Modifier'ın 3D Viewport'ta görünüp görünmeyeceğini kontrol eder."},
    {label:"Render gözü",text:"Modifier'ın sadece son render'da görünüp görünmeyeceğini kontrol eder — ikisi farklı olabilir."},
    {label:"Edit Mode gözü",text:"Modifier'ın Edit Mode'dayken de canlı önizlensin mi, kontrol eder."}
  ],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Modifier stack'ini Photoshop'taki ayarlama katmanlarına benzet: orijinal fotoğrafı (mesh'i) hiç bozmadan üzerine kontrast, renk gibi katmanlar eklersin; her katmanı istediğin an kapatabilir, sırasını değiştirebilir ya da silebilirsin."},
  mistakes:{items:["Bir modifier'ı hiç Apply etmeden dosyayı export edip, formatın modifier'ı desteklemediğini export sonrası fark etmek.","Modifier panelindeki göz ikonlarını karıştırıp, viewport'ta gördüğün sonucun render'da neden farklı çıktığını anlamamak."],
    fix:"Export'a hazırlanırken hangi modifier'ların Apply edilmesi gerektiğini bir kontrol listesi gibi gözden geçir; viewport ve render gözlerinin ikisinin de açık olduğundan emin ol."},
  tip:"Bir modifier'ın adının solundaki üçgene tıklayıp paneli kapatmak (collapse), çok modifier'lı karmaşık bir stack'te işini kolaylaştırır; kapatmak modifier'ı devre dışı bırakmaz, sadece görünümünü sadeleştirir.",
  memorize:{kv:["Modifier = geçici, düzenlenebilir katman"],text:"Modifier stack, mesh'ini kalıcı olarak değiştirmeden şekillendirmeni sağlayan sıralı bir işlem listesidir."},
  next:"mod-solidify"
},

"mod-solidify":{
  kicker:"04.02", subtitle:"İnce, kalınlığı olmayan bir yüzeye gerçek bir hacim kazandır.",
  nedir:["Solidify Modifier, tek katmanlı (kalınlığı olmayan) bir yüzeyi, o yüzeyin normal yönünde ittirerek gerçek bir kalınlığa sahip, kapalı bir hacme dönüştürür."],
  neden:["Bir Plane'den doğrudan bir kapı paneli, bir kumaş parçası ya da ince bir metal levha modellemek istediğinde, geometriyi elle Extrude etmek yerine Solidify ile tüm yüzeye tek seferde, güncellenebilir bir kalınlık verebilirsin."],
  demo:"solidify",
  kullanim:["Bir Plane (ya da tek katmanlı herhangi bir yüzey) seç.","Modifier → Add Modifier → Generate → Solidify.","Thickness değerini ayarla — pozitif değer bir yöne, negatif değer ters yöne kalınlık ekler.","Offset parametresi, kalınlığın orijinal yüzeye göre nereden başlayacağını (içe/dışa/ortalı) belirler."],
  mistakes:{items:["Thickness değerini çok yüksek verip, ince detaylı bir modelde yüzeylerin birbirine geçip 'self-intersection' oluşturması.","Normallerin ters yönde olduğu bir yüzeyde Solidify'ın beklenmedik yöne kalınlık eklemesi."],
    fix:"Thickness'i modelin genel ölçeğine göre küçük tut ve sonucu farklı açılardan kontrol et; yön ters geliyorsa önce Normals dersindeki Recalculate Outside'ı uygula ya da Solidify panelindeki 'Flip Normals' seçeneğini işaretle."},
  tip:"Solidify + Bevel Modifier'ı birlikte kullanmak (Solidify üstte, Bevel altta), ince bir levhanın hem kalınlık kazanmasını hem de o kalınlığın kenarlarının yumuşak görünmesini tek stack'te sağlar.",
  memorize:{kv:["Thickness = kalınlık","Offset = kalınlığın yönü"],text:"Solidify, tek katmanlı bir yüzeyi normal yönünde ittirerek gerçek hacimli bir mesh'e dönüştürür."},
  next:"mod-subdivision"
},

"mod-subdivision":{
  kicker:"04.03", subtitle:"Düşük poligonlu, köşeli bir modeli pürüzsüz ve organik bir forma yumuşat.",
  nedir:["Subdivision Surface Modifier, mesh'inin her yüzeyini matematiksel olarak defalarca bölüp köşelerini yuvarlatarak, orijinal 'kontrol kafesi' (senin gördüğün düşük poligonlu mesh) etrafında pürüzsüz bir 'limit yüzey' hesaplar. Sen hâlâ düşük poligonlu kafesle çalışırsın; yumuşak sonucu sadece görürsün."],
  neden:["Karakterler, organik formlar ve yumuşak yüzeyli objeler için Subdivision, az sayıda vertex ile yüksek detaylı bir görünüm elde etmenin standart yoludur. Hard Surface modülünde gördüğün Support Loops ve Edge Crease, bu modifier'la birlikte çalışarak hangi bölgelerin keskin kalacağını kontrol eder."],
  demo:"subdivision",
  kullanim:["Modifier → Add Modifier → Generate → Subdivision Surface.","'Levels Viewport' değeri, viewport'ta kaç kez bölüneceğini belirler (genelde 2 yeterlidir).","'Levels Render' render sırasında kullanılacak, genelde daha yüksek bir değerdir."],
  mistakes:{items:["Levels değerini çok yüksek tutup (5+) bilgisayarı gereksiz yere yormak — 2-3 seviye çoğu model için fazlasıyla yeterlidir.","Hiç Edge Crease/Support Loop kullanmadan Subdivision uygulayıp, modelin tüm keskin hatlarını kaybetmesi."],
    fix:"Viewport için düşük (1-2), render için orta (2-3) seviyeler kullan; keskin kalması gereken kenarlar için Hard Surface modülündeki Edge Control ve Support Loops tekniklerini uygula."},
  tip:"Subdivision Surface'ı eklemeden önce N panelinden Statistics'i açıp orijinal poligon sayını not et; Levels: 2 ile bu sayının hızla katlanarak arttığını görmek, yüksek seviyelerin neden performansı çabuk tükettiğini somutlaştırır.",
  memorize:{kv:["Levels Viewport ≠ Levels Render"],text:"Subdivision Surface, düşük poligonlu bir kontrol kafesinden pürüzsüz bir limit yüzey hesaplayan bir modifier'dır."},
  next:"mod-sira"
},

"mod-sira":{
  kicker:"04.04", subtitle:"Aynı modifier'lar, farklı sırayla tamamen farklı sonuçlar verir.",
  nedir:["Modifier stack'i yukarıdan aşağıya doğru sırayla hesaplanır — her modifier, kendinden öncekinin çıktısı üzerinde çalışır. Bu yüzden aynı üç modifier'ı (örn. Mirror, Bevel, Subdivision) farklı sırayla dizmek, gözle görülür şekilde farklı sonuçlar üretir."],
  neden:["Sırayı anlamadan modifier eklemek, 'neden modelim garip görünüyor?' sorusunun en sık cevabıdır. Doğru sırayı bilmek, hem doğru sonucu almanı hem de bunu deneme-yanılmayla değil bilerek yapmanı sağlar."],
  kullanim:["Genel kural sırası: önce şekli oluşturan/değiştiren modifier'lar (Mirror, Array, Boolean, Solidify), sonra kenarları işleyen modifier'lar (Bevel), en sonda yüzeyi yumuşatan ya da normali düzelten modifier'lar (Subdivision Surface, Weighted Normal).","Bir modifier'ı panelindeki noktalardan (⋮ ikonu) 'Move Up' / 'Move Down' ile ya da sürükleyerek yeniden sıralayabilirsin."],
  mistakes:{items:["Mirror'ı Bevel'den sonraya koyup, sadece bir tarafın kenarlarının bevel'lenmiş, mirror'lanan tarafın ise keskin kalmış görünmesi.","Subdivision Surface'ı stack'in ortasına, henüz Bevel/Boolean tamamlanmamışken koyup ara sonuçların gereksiz yere yumuşatılması."],
    fix:"Mirror'ı her zaman Bevel'den önce koy; Subdivision Surface'ı (varsa Weighted Normal ile birlikte) her zaman listenin en altında tut."},
  tip:"Emin olmadığın bir sıralama sorununda, her modifier'ın yanındaki göz ikonunu tek tek kapatıp açarak hangi adımın hangi görsel farkı yarattığını izole bir şekilde gözlemle.",
  memorize:{kv:["Şekil → Kenar → Yumuşatma"],text:"İyi bir modifier sırası genelde şekil oluşturan, kenar işleyen ve yumuşatan modifier'lar şeklinde üç aşamaya ayrılır."},
  next:"mod-apply"
},

"mod-apply":{
  kicker:"04.05", subtitle:"Bir modifier'ı ne zaman kalıcı hale getirmeli, ne zaman düzenlenebilir bırakmalısın?",
  nedir:["Apply, bir modifier'ın o ana kadarki etkisini mesh'in gerçek geometrisine kalıcı olarak işleyip modifier'ı stack'ten kaldırma işlemidir. Non-destructive (yıkıcı olmayan) iş akışı ise modifier'ları olabildiğince uzun süre canlı ve düzenlenebilir tutmayı ifade eder."],
  neden:["Her ikisinin de yeri vardır: Apply etmeden bazı işlemleri — örn. Edit Mode'da modifier sonrası oluşan yeni geometriyi elle düzenlemek, ya da bir Boolean'ın üzerine başka bir Boolean uygulamak — yapamazsın; ama çok erken Apply edersen modelinin oranlarını sonradan değiştirme esnekliğini kaybedersin."],
  kullanim:["Ctrl+A → modifier'ı Apply eder (obje seçiliyken); modifier panelinden aynı işlemi açılır menüden de yapabilirsin.","Genel kural: modelin genel oranlarıyla hâlâ oynuyorsan Apply etme; modelin son hâline karar verdiysen ve export/ileri düzenleme öncesindeysen Apply et."],
  mistakes:{items:["Bir Boolean modifier'ın üstüne ikinci bir Boolean eklemeye çalışıp, ilkini Apply etmediği için beklenmedik sonuç almak.","Her şeyi 'garanti olsun' diye erkenden Apply edip, sonradan bir ölçü hatasını düzeltmek için modeli baştan kurmak zorunda kalmak."],
    fix:"Zincirleme Boolean işlemlerinde her adımı sırayla Apply ede ede ilerle; genel kural olarak modelin ortasında değil, sadece son teslim öncesinde toplu Apply yap."},
  tip:"Apply etmeden önce objenin bir kopyasını (Shift+D, ardından görünmez yapılmış bir katmana taşınmış hâliyle) sakla; bu, 'kalıcı hale getirdim ama sonra pişman oldum' anlarında hayat kurtarır.",
  memorize:{kv:["Ctrl+A = Apply"],text:"Apply, bir modifier'ın etkisini kalıcı geometriye dönüştürüp modifier'ı stack'ten kaldırır."},
  miniTask:{rules:["Hard Surface modülünde yaptığın bir modeli aç","Modifier stack'ini incele — kaç modifier olduğunu say","Her birini sırayla gizleyip açarak (viewport gözü) tek başına ne yaptığını gözlemle","Modelin son hâlinden eminsen tümünü Apply et"],
    solution:"Modifier panelinde her modifier'ın viewport göz ikonuna tek tek tıklayarak etkisini izole et; hepsinden eminsen her modifier'ı sırayla Apply et (üstteki modifier'dan başlayarak)."},
  next:"mat-nedir"
},

"mat-nedir":{
  kicker:"05.01", subtitle:"Bir yüzeyin ışıkla nasıl etkileşime gireceğini tanımlayan tarif.",
  nedir:["Bir Material (materyal), bir yüzeyin rengini, ışığı ne kadar yansıttığını, parlak mı mat mı göründüğünü, metal mi cam mı olduğunu tanımlayan kurallar bütünüdür. Bir mesh'in şekli 'ne olduğunu', materyali ise 'neyden yapıldığını' gösterir."],
  neden:["Aynı küp modeli, üzerine atanan materyale göre tahtadan bir sandık, parlak bir metal küp ya da mat bir beton blok gibi görünebilir. Modelleme 'form'u, materyal ise 'malzemeyi' tanımlar — ikisi birlikte bir objenin gerçekçiliğini oluşturur."],
  kullanim:["Properties panelinden Material (küre ikonu) sekmesine gir.","New ile yeni bir materyal oluştur, materyale anlamlı bir isim ver (örn. 'Tahta_Kirmizi').","Base Color'a tıklayıp renk seç.","Bir obje birden fazla materyal slotu taşıyabilir — örn. bir sandığın gövdesi tahta, menteşeleri metal materyali kullanabilir."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Materyali bir kumaşın türü gibi düşün: aynı gömlek kalıbı (mesh) pamuktan da yapılabilir, ipekten de — kalıp aynı kalır ama kumaşın (materyalin) parlaklığı, dokusu, ışığa tepkisi tamamen değişir."},
  mistakes:{items:["Yeni bir materyal oluşturmadan doğrudan Base Color değiştirmeye çalışıp hiçbir şeyin değişmediğini görmek — önce 'New' ile bir materyal ataman gerekir.","Aynı materyali birden fazla objeye atadıktan sonra birini değiştirince hepsinin değiştiğini fark etmemek — materyaller obje başına değil, veri başına paylaşılır."],
    fix:"Bir materyali sadece o objeye özel yapmak istiyorsan, materyal adının yanındaki sayı ikonuna tıklayıp 'Single User' kopyasını oluştur."},
  tip:"Materyallere anlamlı isimler ver — çok materyalli bir sahnede bu, sonradan hangi materyalin nerede kullanıldığını bulmanı çok kolaylaştırır.",
  memorize:{kv:["Mesh = şekil","Material = malzeme"],text:"Materyal, bir yüzeyin ışıkla nasıl etkileşime gireceğini tanımlayan kural setidir."},
  next:"mat-bsdf"
},

"mat-bsdf":{
  kicker:"05.02", subtitle:"Blender'ın gerçekçi yüzeyler için kullandığı, hemen her materyali tek bir düğümde tanımlayabilen evrensel shader'ı.",
  nedir:["Principled BSDF, yeni oluşturduğun her materyalin varsayılan shader'ıdır. Metal, plastik, cam, kumaş, deri gibi çok farklı yüzey türlerini, tek bir düğümün üzerindeki farklı parametreleri ayarlayarak simüle edebilecek şekilde tasarlanmıştır."],
  neden:["Eskiden her yüzey türü için ayrı ayrı shader düğümleri birleştirmek gerekirdi; Principled BSDF bunların çoğunu tek bir yerde topladığı için, yeni başlayanlar bile birkaç kaydırıcıyla inandırıcı sonuçlar alabilir."],
  kullanim:["Materyal atadığında Properties panelinde karşına çıkan büyük düğüm Principled BSDF'tir.","Base Color: yüzeyin temel rengi.","Metallic: metalik mi değil mi.","Roughness: pürüzlülük/parlaklık.","Specular/IOR: yansıma yoğunluğu.","Transmission: ışığın içinden geçip geçmediği.","Emission: kendi ışığını yayması.","Normal: yüzey detayı hissi."],
  kisayolAyrinti:[
    {label:"Base Color",text:"Yüzeyin temel rengi/albedo'su."},
    {label:"Metallic",text:"0 = metal değil (plastik, tahta, kumaş), 1 = tam metal (çelik, altın, bakır)."},
    {label:"Roughness",text:"0 = ayna gibi parlak, 1 = tamamen mat."}
  ],
  mistakes:{items:["Metallic'i 1 yapıp Base Color'ı da beyaz bırakmak — gerçek metaller genelde Base Color'da metalin kendi rengini (altın için sarımsı, bakır için kırmızımsı) taşır.","Roughness'ı 0'da bırakıp modelin plastik/ayna gibi aşırı parlak görünmesine şaşırmak — gerçek dünyada tam pürüzsüz yüzey nadirdir."],
    fix:"Metallic materyallerde Base Color'ı metalin kendi rengine ayarla; Roughness'ı tamamen 0 yerine 0.1-0.3 gibi hafif bir değerde tutmak çoğu zaman daha gerçekçi durur."},
  tip:"Bir materyali tanımlarken önce sadece üç parametreyle (Base Color, Metallic, Roughness) başla; Specular/IOR/Transmission gibi ileri parametrelere sadece belirli bir ihtiyacın (cam, su, deri gibi) olduğunda dokun.",
  memorize:{kv:["Principled BSDF = evrensel shader"],text:"Principled BSDF, Base Color/Metallic/Roughness gibi birkaç parametreyle çoğu gerçek dünya yüzeyini simüle edebilen tek düğümdür."},
  next:"mat-roughness-metallic"
},

"mat-roughness-metallic":{
  kicker:"05.03", subtitle:"Bir yüzeyin metal mi olduğunu ve ne kadar parlak göründüğünü belirleyen iki temel parametre.",
  nedir:["Metallic, bir yüzeyin metalik mi (elektriksel olarak iletken, ışığı kendine özgü şekilde yansıtan) yoksa dielektrik mi (metal olmayan — plastik, tahta, deri, kumaş) olduğunu tanımlar. Roughness ise o yüzeyin mikroskobik düzeyde ne kadar pürüzlü olduğunu, dolayısıyla yansımaların ne kadar keskin ya da dağınık göründüğünü belirler."],
  neden:["Bu iki parametre, bir materyalin 'ne olduğu' hissini en çok etkileyen iki değerdir. Aynı Base Color'a sahip iki küre, sadece Metallic ve Roughness farklı olduğunda tamamen farklı malzemeler — biri cilalı metal, diğeri mat plastik — gibi görünebilir."],
  demo:"material",
  kullanim:["Roughness 0.0 → ayna gibi keskin yansımalar (cilalı krom).","Roughness 0.5 → yarı mat, yumuşak yansımalar (fırçalanmış metal, mat plastik).","Roughness 1.0 → hiç net yansıma yok, tamamen dağınık ışık (tebeşir, mat boya).","Metallic 0 → dielektrik (plastik, tahta, deri).","Metallic 1 → tam metal (altın, bakır, çelik) — ara değerler nadiren gerçekçidir."],
  mistakes:{items:["Metallic'i 0 ile 1 arasında (örn. 0.5) bir ara değerde bırakmak — gerçek dünyada bir yüzey ya metaldir ya değildir; ara değerler çoğunlukla 'ne olduğu belirsiz' bir görünüm verir.","Roughness'ı sahnenin tamamında aynı bırakıp, hiçbir yüzeyin birbirinden malzeme olarak ayrışmamasına neden olmak."],
    fix:"Metallic'i neredeyse her zaman tam 0 ya da tam 1 olarak ayarla; sahnedeki farklı objelere kasıtlı olarak farklı Roughness değerleri vererek malzeme çeşitliliği hissi yarat."},
  tip:"Bir yüzeyin gerçek dünyadaki halini hatırlamakta zorlanıyorsan, elindeki bir objeye (telefonun arkası, bir bardak, bir tahta masa) bakıp ışığın üzerinde nasıl bir yansıma bıraktığını gözlemle — bu gözlem, Roughness değerini tahmin etmede en iyi referansındır.",
  memorize:{kv:["Metallic: 0 ya da 1","Roughness: 0 = parlak, 1 = mat"],text:"Metallic yüzeyin metal olup olmadığını, Roughness ise o yüzeyin ne kadar parlak/mat göründüğünü belirler."},
  next:"mat-transmission"
},

"mat-transmission":{
  kicker:"05.04", subtitle:"Işığın bir yüzeyden yansımak yerine içinden geçmesini sağla — cam ve su gibi malzemeler için.",
  nedir:["Transmission, bir materyalin ışığı ne kadar 'içinden geçirdiğini' (saydamlığını) tanımlar. Transmission 0 iken yüzey tamamen opak (ışık geçmez), 1'e yaklaştıkça yüzey cam ya da su gibi ışığı içinden geçiren bir malzemeye dönüşür."],
  neden:["Transmission olmadan cam, su, buz gibi saydam/yarı saydam malzemeleri gerçekçi şekilde modellemek mümkün olmaz. Bu parametre, Roughness ve IOR (kırılma indisi) ile birlikte çalışarak ışığın malzemenin içinde nasıl kırılacağını belirler."],
  kullanim:["Principled BSDF üzerinde Transmission'ı 1.0'a yaklaştır.","IOR değerini malzemenin gerçek kırılma indisine göre ayarla (cam ~1.45, su ~1.33, elmas ~2.42).","Roughness'ı düşük tut (0-0.1) net bir cam için, ya da buzlu cam efekti için biraz yükselt."],
  kisayolAyrinti:[
    {label:"IOR (cam)",text:"~1.45 — çoğu pencere/şişe camı için gerçekçi değer."},
    {label:"IOR (su)",text:"~1.33"},
    {label:"Roughness (net cam)",text:"0 - 0.05 arası, net bir görüntü için düşük tutulmalı."}
  ],
  mistakes:{items:["Transmission açıkken Eevee kullanıyorsan bazı ek ayarların (Screen Space Refraction gibi) ayrıca açılması gerektiğini unutmak — aksi halde saydamlık beklendiği gibi görünmeyebilir.","Transmission'lı bir objenin arkasında hiçbir şey olmadığında saydamlığın 'etkisiz' görünmesi ve bunun bir hata sanılması."],
    fix:"Eevee kullanıyorsan Material Properties → Settings altındaki Blend Mode ve Show Backface ayarlarını kontrol et; Render Properties'ten Screen Space Refraction'ı aç. Cycles'ta bu ek ayarlara genelde gerek kalmaz."},
  tip:"Transmission'lı bir objeyi test ederken arkasına, saydamlığın gerçekten çalıştığını görebileceğin desenli ya da renkli bir arka plan/obje koy — düz, tek renkli bir arka plan önünde saydamlık fark edilmesi zor olabilir.",
  memorize:{kv:["Transmission 0 = opak","Transmission 1 = cam/su gibi saydam"],text:"Transmission, ışığın yüzeyden yansımak yerine içinden geçmesini sağlayan parametredir."},
  next:"mat-emission"
},

"mat-emission":{
  kicker:"05.05", subtitle:"Bir yüzeyin herhangi bir ışık kaynağına ihtiyaç duymadan kendi ışığını yaymasını sağla.",
  nedir:["Emission, bir materyale kendi ışık yayma özelliği kazandırır — sahnedeki hiçbir lambaya ihtiyaç duymadan, o yüzeyin kendisi parlar. Neon tabelalar, ekranlar, kor halindeki metal gibi yüzeyler için kullanılır."],
  neden:["Bazı yüzeyler fiziksel olarak ışık kaynağıdır ve bunları ayrı bir lamba objesiyle simüle etmek yerine, doğrudan materyalin kendisine ışık yayma özelliği vermek hem daha kolay hem de o yüzeyin şeklini (örn. bir neon harfin şeklini) doğrudan ışık kaynağı yapar."],
  kullanim:["Principled BSDF üzerinde Emission Color'a yaymak istediğin rengi (örn. neon mavi) ata.","Emission Strength değerini artırarak parlaklığı ayarla — Strength 1'in altında hafif bir iç ışıma, yüksek değerlerde (5-20+) gerçek bir ışık kaynağı gibi sahneyi aydınlatabilen bir parlaklık elde edersin."],
  mistakes:{items:["Emission Strength'i çok düşük bırakıp materyalin 'parlıyormuş' hissi vermemesi.","Emission'lı bir yüzeyin sahneyi gerçekten aydınlatmasını beklemek ama Eevee'de 'Bloom' render efekti açılmadan parlamanın belirgin görünmemesi."],
    fix:"Strength değerini kademeli olarak artırarak (1 → 5 → 15) test et; Eevee'de gerçek bir ışıma/glow hissi için Render Properties → Bloom'u aç."},
  tip:"Emission'lı bir yüzeyi tek başına ışık kaynağı olarak kullanmak yerine, gerçek bir Light objesiyle (Point/Area) birlikte kullanmak, hem yüzeyin görsel olarak parlamasını hem de çevresinin gerçekten aydınlanmasını sağlar — Emission tek başına genelde sahneyi yeterince aydınlatmaz.",
  memorize:{kv:["Emission Color + Strength"],text:"Emission, bir yüzeyin harici bir ışık kaynağına ihtiyaç duymadan kendi ışığını yaymasını sağlayan parametredir."},
  next:"mat-shader-editor"
},

"mat-shader-editor":{
  kicker:"05.06", subtitle:"Materyalleri düğümleri birbirine bağlayarak görsel olarak inşa ettiğin çalışma alanı.",
  nedir:["Shader Editor, Principled BSDF gibi hazır düğümleri, doku (texture) düğümleriyle, matematik işlemleriyle ve diğer shader'larla birbirine bağlayarak daha karmaşık, özel materyaller kurabileceğin bir node-based (düğüm tabanlı) editördür."],
  neden:["Properties panelindeki basit kaydırıcılar çoğu materyal için yeterlidir, ama bir dokunun rengini bir başka dokuyla karıştırmak, bir yüzeyin belirli bir açıya göre farklı görünmesini sağlamak (Fresnel) ya da prosedürel desenler oluşturmak istediğinde Shader Editor'a geçmen gerekir."],
  kullanim:["Ekranın altındaki editör türü seçicisinden Shader Editor'ı aç (ya da üstteki 'Shading' sekmesine geç).","Add (Shift+A) ile yeni düğümler ekle.","Düğümlerin soket noktalarını (küçük daireler) birbirine sürükleyerek bağla.","En sık kullanılan ek düğümler: Image Texture (bir doku dosyasını okur), Mix Color (iki rengi/dokuyu karıştırır), Fresnel (bakış açısına göre değişen bir değer üretir)."],
  mistakes:{items:["Bir Image Texture düğümü eklendiğinde, onu Principled BSDF'in Base Color soketine bağlamayı unutup dokunun hiç görünmemesi.","Düğüm ağını çok karmaşıklaştırıp, hangi düğümün ne işe yaradığını zamanla unutmak."],
    fix:"Her yeni düğümü ekledikten hemen sonra bir önceki/sonraki düğüme bağla, yarım bırakma; karmaşık ağlarda düğümleri N panelinden isimlendirmek ya da Frame (Ctrl+J) ile gruplamak, ağı okunur tutar."},
  tip:"Shader Editor'da bir düğümün her soketine (Base Color, Roughness gibi) sadece sabit bir değer değil, başka bir düğümün çıktısını da bağlayabileceğini unutma — bu, prosedürel ve doku tabanlı materyallerin temelidir.",
  memorize:{kv:["Shift+A = yeni düğüm ekle"],text:"Shader Editor, materyalleri düğümleri birbirine bağlayarak görsel olarak kurduğun bir node tabanlı editördür."},
  next:"uv-nedir"
},

"uv-nedir":{
  kicker:"06.01", subtitle:"3D bir yüzeyi, doku uygulayabilmek için 2D bir düzleme açma sistemi.",
  nedir:["UV, bir mesh'in her vertex'ine atanan, o vertex'in 2 boyutlu bir doku (texture) görselinin neresine karşılık geldiğini gösteren ek bir koordinat çiftidir (U yatay, V dikey eksen). 'UV' ismi, X/Y/Z zaten 3D konum için kullanıldığından, 2D doku koordinatları için alfabenin önceki iki harfinin seçilmesinden gelir."],
  neden:["Bir doku dosyası düz, iki boyutlu bir resimdir. Bu resmi kavisli, üç boyutlu bir yüzeye 'doğru' şekilde sarabilmek için, Blender'ın her 3D noktanın o 2D resmin hangi pikseline karşılık geldiğini bilmesi gerekir — UV tam olarak bu eşleşmeyi tanımlar."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"UV'yi bir dünya haritasına benzet: yer küre (3D) üç boyutludur ama bir haritada (2D kağıtta) gösterilir; bu gösterim sırasında kıtaların şeklinin biraz 'bozulması' (distortion) kaçınılmazdır — UV unwrap de benzer bir 3D'den 2D'ye açma işlemidir."},
  kullanim:["Her yeni eklenen primitive objenin (Cube, Sphere gibi) otomatik, hazır bir UV'si vardır.","Karmaşık, elle modellediğin bir mesh için bu UV'yi kendin oluşturman (unwrap etmen) gerekir.","UV Editing sekmesinden hem 3D modelini hem de onun açılmış 2D UV düzenini yan yana görebilirsin."],
  mistakes:{items:["UV kavramını atlayıp doğrudan doku uygulamaya çalışmak — doku olmadan UV de anlamsızdır ama UV olmadan doku hep bozuk/gerilmiş görünür.","UV'yi 'bir kere yapılır bitermiş' gibi düşünüp, modelde sonradan yapılan büyük şekil değişikliklerinden sonra UV'yi güncellemeyi unutmak."],
    fix:"Modelleme tamamlandıktan, ama doku/materyal aşamasına geçmeden önce UV'yi son bir kez gözden geçir; büyük bir şekil değişikliği yaptıysan o bölgenin UV'sini yeniden aç."},
  memorize:{kv:["U = yatay, V = dikey"],text:"UV, bir 3D yüzeyi 2D bir doku görseline eşleyen koordinat sistemidir."},
  next:"uv-seam"
},

"uv-seam":{
  kicker:"06.02", subtitle:"Mesh'i nereden 'keseceğini' işaretleyerek düzgün açılmasını sağla.",
  nedir:["Seam (dikiş), bir mesh üzerinde UV açılımının 'kesileceği' kenarları işaretlemendir. Bir mesh'i 2D'ye açmak, üç boyutlu bir kutuyu makasla kesip düzleştirmeye benzer — Seam, o makasın nereden keseceğini belirler."],
  neden:["Seam işaretlemeden bir Unwrap denediğinde, Blender kendi otomatik tahminine göre keser; bu genelde dağınık, çok parçalı ya da gereksiz gerilmiş bir UV düzeni üretir. Seam'leri elle, mantıklı yerlerden belirlemek çok daha temiz bir sonuç verir."],
  kullanim:["Edit Mode'da Edge select modunda, kesmek istediğin kenar(ler)i seç.","Sağ tık → Mark Seam (kesikli kırmızı bir çizgi olarak görünür).","Seam'i kaldırmak için aynı menüden Clear Seam."],
  analogy:{title:"Gerçek hayat benzetmesi",text:"Seam'i bir karton kutuyu düzleştirmeden önce hangi kenarlarından keseceğine karar vermeye benzet: yanlış yerden kesersen kutu açıldığında parçalar birbirinden kopar ya da garip şekilde çakışır."},
  mistakes:{items:["Çok az Seam koyup, mesh'in tek parça halinde açılmaya zorlanması ve aşırı gerilmesi.","Çok fazla Seam koyup, UV'nin gereksiz yere küçük, dağınık parçalara (island) bölünmesi."],
    fix:"Dengeyi bul: genelde bir objenin doğal 'kenar' sayılan yerlerini (bir kutunun köşeleri, bir karakterin görünmeyen iç bölgeleri) Seam yap; ideal Seam sayısı şekle göre değişir, birkaç deneme-yanılma normaldir."},
  memorize:{kv:["Sağ tık → Mark Seam"],text:"Seam, bir mesh'in UV açılımı için nereden 'kesileceğini' işaretleyen bir çizgidir."},
  next:"uv-unwrap"
},

"uv-unwrap":{
  kicker:"06.03", subtitle:"İşaretlediğin Seam'lere göre mesh'i gerçekten 2D düzleme aç.",
  nedir:["Unwrap, Seam olarak işaretlediğin kenarlardan mesh'i matematiksel olarak 'keserek' düz bir 2D düzene yayan işlemdir. Sonuç, UV Editor'da gördüğün, her biri bir 'ada' (island) olarak adlandırılan parçalardan oluşan bir düzendir."],
  neden:["Bu işlem olmadan doku, mesh üzerine rastgele/varsayılan bir şekilde uygulanır ve genelde gerilmiş, yanlış hizalanmış görünür. Doğru bir Unwrap, dokunun model üzerinde oranlı ve doğru yönde görünmesini garanti eder."],
  demo:"unwrap",
  kullanim:["Seam'lerini işaretledikten sonra Edit Mode'da tüm mesh'i seç (A).","U tuşuna bas → 'Unwrap' seç.","Sonuç UV Editor panelinde görünür; burada UV adalarını elle de taşıyabilir, döndürebilir, boyutlandırabilirsin."],
  mistakes:{items:["Unwrap sonrası UV Editor'ı hiç açıp kontrol etmeden doğrudan doku uygulamaya geçmek.","UV adalarının birbirinin üzerine çakışmasına (overlap) izin vermek — bu, iki farklı 3D bölgenin dokuda aynı pikselleri paylaşmasına neden olur."],
    fix:"Unwrap sonrası her zaman UV Editor'ı aç ve adaların makul bir düzende, çakışmadan durduğunu gözden geçir; gerekirse elle küçük düzeltmeler yap."},
  tip:"Bir küpü ilk kez Unwrap denerken, sonucu görsel olarak anlamak için UV Editor'da açıkken kareli bir 'UV Grid' test dokusu ata — karelerin ne kadar düzgün/orantılı kaldığını görmek, açılımının kalitesini hemen gösterir.",
  memorize:{kv:["U = Unwrap menüsü"],text:"Unwrap, Seam'lerle işaretlenmiş bir mesh'i gerçekten 2D bir UV düzenine açan işlemdir."},
  next:"uv-texture"
},

"uv-texture":{
  kicker:"06.04", subtitle:"UV'nin üzerine gerçek bir doku görselini nasıl doğru şekilde yerleştirirsin?",
  nedir:["UV açılımın hazır olduğunda, artık üzerine gerçek bir doku (texture) dosyası — bir resim — yerleştirebilirsin. Bu resmin çözünürlüğü (piksel boyutu) ve UV adalarının o resim içindeki kaplama oranı (texel density), son görüntü kalitesini doğrudan belirler."],
  neden:["Aynı doku dosyası, küçük bir objede keskin görünürken, çok büyük bir objede bulanık/pikselli görünebilir — çünkü aynı sayıda piksel çok daha geniş bir yüzeye 'gerilmiş' olur. Çözünürlük ve UV boyutlandırmasını anlamak, tutarlı kalitede bir sahne kurmanı sağlar."],
  kullanim:["Shader Editor'da bir Image Texture düğümü ekle, doku dosyanı seç.","Çıkışını Principled BSDF'in Base Color'ına bağla.","UV Editor'da bir adanın boyutunu büyütmek o bölgeye daha fazla doku detayı (piksel) ayırır; küçültmek daha az detay ayırır — bu dengeye 'texel density' denir."],
  mistakes:{items:["Sahnedeki tüm objelere aynı çözünürlükte doku kullanıp, kameraya yakın küçük bir objenin bulanık, uzak büyük bir objenin ise gereksiz yere ağır gelmesi.","UV adalarının boyutlarını rastgele bırakıp, bazı bölgelerin dokuda aşırı büyük bazı bölgelerin aşırı küçük yer kaplaması."],
    fix:"Kameraya yakın/önemli objelere daha yüksek çözünürlük ayır; UV Editor'da adaların göreli boyutlarını, o bölgenin gerçek 3D'deki büyüklüğüyle orantılı tutmaya çalış."},
  tip:"Bir doku dosyasını içe aktarırken dosya boyutunun 2'nin kuvveti (512, 1024, 2048, 4096 piksel gibi) olması, hem Blender hem oyun motorlarında (Unity, Unreal Engine) bellek kullanımı ve mipmap oluşturma açısından en verimli sonucu verir.",
  memorize:{kv:["Texel density = UV boyutu / doku çözünürlüğü dengesi"],text:"Doku çözünürlüğü ve UV adası boyutu birlikte, son görüntünün ne kadar keskin ya da bulanık göründüğünü belirler."},
